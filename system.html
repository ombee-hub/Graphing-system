<script>
'use strict';

/* ============================================================
   כלי עזר
   ============================================================ */
const fmtInt = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 0 });
const fmtCompact = new Intl.NumberFormat('he-IL', { notation: 'compact', maximumFractionDigits: 1 });
const fmtPct = v => v.toLocaleString('he-IL', { maximumFractionDigits: 1 }) + '%';
const nis = v => '₪' + fmtInt.format(v);
const nisCompact = v => '₪' + fmtCompact.format(v);
const num = v => parseFloat(String(v ?? '').replace(/,/g, '')) || 0;

const MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function monthLabel(ym) { // "2026/06" -> "יוני 26"
  const [y, m] = ym.split('/');
  return MONTH_NAMES[parseInt(m, 10) - 1] + ' ' + y.slice(2);
}
function periodLabel(months) {
  if (!months.length) return '';
  const a = months[0], b = months[months.length - 1];
  const [ya, ma] = a.split('/'), [yb, mb] = b.split('/');
  if (a === b) return MONTH_NAMES[+ma - 1] + ' ' + ya;
  if (ya === yb) return MONTH_NAMES[+ma - 1] + ' – ' + MONTH_NAMES[+mb - 1] + ' ' + ya;
  return MONTH_NAMES[+ma - 1] + ' ' + ya + ' – ' + MONTH_NAMES[+mb - 1] + ' ' + yb;
}
function niceTicks(max) {
  if (max <= 0) return { max: 1, ticks: [0, 1] };
  const raw = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * pow).find(s => s >= raw);
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let t = 0; t <= top + step / 2; t += step) ticks.push(t);
  return { max: top, ticks };
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function svgEl(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  // המסמך RTL אבל מערכת הצירים של הגרף בנויה LTR — בלי זה עוגני הטקסט מתהפכים
  if (tag === 'svg') e.style.direction = 'ltr';
  return e;
}
function hashString(s) { // FNV-1a לזיהוי נתונים כפולים
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16) + '-' + s.length;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ============================================================
   פענוח קבצים — זיהוי סוג הדוח ובניית נתונים מצטברים
   ============================================================ */
function detectAndParse(wb, fileName) {
  const names = wb.SheetNames;
  if (names.includes('פגומים') && names.includes('SUM')) return parseDamaged(wb, fileName);
  // חיפוש גיליון קריאות שירות (יכול לא להיות הגיליון הראשון)
  for (const n of names) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: false });
    if (rows[0] && rows[0].includes('מס קריאת שירות') && rows[0].includes('מוצדק'))
      return parseServiceCalls(wb, fileName, rows);
  }
  const first = XLSX.utils.sheet_to_json(wb.Sheets[names[0]], { header: 1, defval: null, raw: false });
  if (first[0] && first[0].includes('מסמך ספירת מלאי')) return parseInventory(wb, fileName, first);
  return parseGeneric(wb, fileName);
}

/* --- דוח קריאות שירות (מוצדק / לא מוצדק) --- */
function parseServiceCalls(wb, fileName, rows) {
  const h = rows[0];
  const di = h.indexOf('תאריך קריאת שירות'), ci = h.indexOf('מס קריאת שירות'),
        ji = h.indexOf('מוצדק'), cu = h.indexOf('שם לקוח'),
        ti = h.indexOf('תיאור סוג קריאה'), ri = h.indexOf('תיאור סיבה');

  // שורה לכל פריט בקריאה — סופרים קריאות ייחודיות לפי מס קריאה
  const calls = new Map();
  for (const r of rows.slice(1)) {
    if (!r[ci]) continue;
    if (!calls.has(r[ci])) {
      const p = String(r[di] || '').split('/'); // M/D/YY
      const month = p.length >= 3 ? '20' + p[2].slice(-2) + '/' + String(p[0]).padStart(2, '0') : null;
      calls.set(r[ci], {
        month,
        just: r[ji] || 'ללא סיווג',
        customer: r[cu] || 'ללא לקוח',
        type: r[ti] || 'ללא סוג',
        reason: r[ri] || 'ללא סיבה',
        lines: 0,
      });
    }
    calls.get(r[ci]).lines++;
  }

  const JUST_ORDER = ['מוצדק', 'לא מוצדק', 'שירות'];
  const byMonth = new Map(), byCustomer = new Map(), byType = new Map(), byReason = new Map();
  const justTotals = {};
  for (const c of calls.values()) {
    if (c.month) {
      const m = byMonth.get(c.month) || {};
      m[c.just] = (m[c.just] || 0) + 1;
      byMonth.set(c.month, m);
    }
    justTotals[c.just] = (justTotals[c.just] || 0) + 1;
    for (const [map, key] of [[byCustomer, c.customer], [byType, c.type], [byReason, c.reason]]) {
      const e = map.get(key) || { total: 0, just: 0, unjust: 0 };
      e.total++;
      if (c.just === 'מוצדק') e.just++;
      if (c.just === 'לא מוצדק') e.unjust++;
      map.set(key, e);
    }
  }
  const months = [...byMonth.keys()].sort();
  const justKinds = JUST_ORDER.filter(k => justTotals[k]);
  Object.keys(justTotals).forEach(k => { if (!justKinds.includes(k)) justKinds.push(k); });
  const toSorted = m => [...m.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.total - a.total);
  return {
    kind: 'calls', fileName,
    months, justKinds, justTotals,
    byMonth: months.map(m => ({ m, ...Object.fromEntries(justKinds.map(k => [k, byMonth.get(m)[k] || 0])) })),
    byCustomer: toSorted(byCustomer),
    byType: toSorted(byType),
    byReason: toSorted(byReason),
    totalCalls: calls.size,
    totalLines: rows.length - 1,
  };
}

/* --- דוח העברות למחסן פגומים --- */
function parseDamaged(wb, fileName) {
  const out = { kind: 'damaged', fileName };

  // גיליון SUM: חודש × סיבה × שווי — מדלגים על שורות סיכום־ביניים (סיבה ריקה)
  const sum = XLSX.utils.sheet_to_json(wb.Sheets['SUM'], { header: 1, defval: null, raw: false });
  const hIdx = sum.findIndex(r => r && r.includes('Posting Date Year/Month'));
  const byMonth = new Map(), byReason = new Map();
  for (const r of sum.slice(hIdx + 1)) {
    const [month, reason, , qty, sumNis] = r;
    if (!month || !/^\d{4}\/\d{2}$/.test(month) || !reason) continue;
    const m = byMonth.get(month) || { nis: 0, qty: 0 };
    m.nis += num(sumNis); m.qty += num(qty); byMonth.set(month, m);
    const rr = byReason.get(reason) || { nis: 0, qty: 0 };
    rr.nis += num(sumNis); rr.qty += num(qty); byReason.set(reason, rr);
  }
  out.months = [...byMonth.keys()].sort();
  out.sumByMonth = out.months.map(m => ({ m, ...byMonth.get(m) }));
  out.reasons = [...byReason.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.nis - a.nis);
  out.sumTotal = out.sumByMonth.reduce((s, r) => s + r.nis, 0);

  // גיליון פגומים: פירוט ברמת פריט
  const pg = XLSX.utils.sheet_to_json(wb.Sheets['פגומים'], { header: 1, defval: null, raw: false });
  const pIdx = pg.findIndex(r => r && r.includes('שם הפריט'));
  const ph = pg[pIdx];
  const ni = ph.indexOf('שם הפריט'), qi = ph.indexOf('כמות פגומים'), pi = ph.indexOf('מחיר'), ri = ph.indexOf('תיאור סיבה');
  const items = new Map(), dReasons = new Map();
  let dRows = 0, dQty = 0, dVal = 0;
  for (const r of pg.slice(pIdx + 1)) {
    if (!r[ni]) continue;
    const q = num(r[qi]), val = q * num(r[pi]);
    dRows++; dQty += q; dVal += val;
    const it = items.get(r[ni]) || { val: 0, qty: 0 };
    it.val += val; it.qty += q; items.set(r[ni], it);
    const reason = r[ri] || 'ללא סיבה';
    const dr = dReasons.get(reason) || { val: 0, qty: 0 };
    dr.val += val; dr.qty += q; dReasons.set(reason, dr);
  }
  out.detail = {
    rows: dRows, qty: dQty, val: dVal,
    topItems: [...items.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.val - a.val),
    byReason: [...dReasons.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.val - a.val),
  };

  // גיליון השמדות
  out.dest = null;
  if (wb.Sheets['השמדות']) {
    const ds = XLSX.utils.sheet_to_json(wb.Sheets['השמדות'], { header: 1, defval: null, raw: false });
    const dIdx = ds.findIndex(r => r && r.includes('Product Number'));
    const dh = ds[dIdx];
    const mi = dh.indexOf('Posting Date Year/Month'), dqi = dh.indexOf('New Quantity'), dpi = dh.indexOf('Yarpa Price');
    const dm = new Map();
    let tot = 0, totQ = 0, totRows = 0;
    for (const r of ds.slice(dIdx + 1)) {
      const m = r[mi];
      if (!m || !/^\d{4}\/\d{2}$/.test(m)) continue;
      const v = num(r[dqi]) * num(r[dpi]);
      const e = dm.get(m) || { nis: 0, qty: 0, rows: 0 };
      e.nis += v; e.qty += num(r[dqi]); e.rows++; dm.set(m, e);
      tot += v; totQ += num(r[dqi]); totRows++;
    }
    const dMonths = [...dm.keys()].sort();
    out.dest = { byMonth: dMonths.map(m => ({ m, ...dm.get(m) })), total: tot, qty: totQ, rows: totRows };
  }
  return out;
}

/* --- דוח ספירות מלאי --- */
function parseInventory(wb, fileName, rows) {
  const h = rows[0];
  const di = h.indexOf('נוצר בתאריך'), ri = h.indexOf('תיאור סיבה'),
        ai = h.indexOf('כמות הפרש מוחלטת'), zi = h.indexOf('אזור פעילות'),
        ddi = h.indexOf('כמות ההפרש'), yi = h.indexOf('שנת מסמך');
  const byMonth = new Map(), byReason = new Map(), byArea = new Map();
  let total = 0, diffRows = 0, absQty = 0;
  for (const r of rows.slice(1)) {
    if (!r[di]) continue;
    total++;
    // תאריך בפורמט M/D/YY
    const p = String(r[di]).split('/');
    const year = r[yi] || ('20' + (p[2] || '').slice(-2));
    const m = year + '/' + String(p[0]).padStart(2, '0');
    const abs = num(r[ai]);
    const isDiff = abs > 0;
    if (isDiff) { diffRows++; absQty += abs; }

    const mm = byMonth.get(m) || { counts: 0, diffRows: 0, absQty: 0 };
    mm.counts++; if (isDiff) { mm.diffRows++; mm.absQty += abs; } byMonth.set(m, mm);

    const reason = r[ri] || 'ללא סיבה';
    const rr = byReason.get(reason) || { counts: 0, diffRows: 0 };
    rr.counts++; if (isDiff) rr.diffRows++; byReason.set(reason, rr);

    const area = r[zi] || 'ללא אזור';
    const aa = byArea.get(area) || { counts: 0, diffRows: 0, absQty: 0 };
    aa.counts++; if (isDiff) { aa.diffRows++; aa.absQty += abs; } byArea.set(area, aa);
  }
  const months = [...byMonth.keys()].sort();
  return {
    kind: 'inventory', fileName,
    months,
    byMonth: months.map(m => ({ m, ...byMonth.get(m) })),
    byReason: [...byReason.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.counts - a.counts),
    byArea: [...byArea.entries()].map(([name, v]) => ({ name, ...v })).sort((a, b) => b.counts - a.counts),
    total, diffRows, absQty,
  };
}

/* --- קובץ לא מזוהה: ניסיון גרף כללי + טבלה --- */
function parseGeneric(wb, fileName) {
  const name = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: false });
  // מציאת שורת כותרת: השורה הראשונה שרובה טקסט ואחריה נתונים
  let hIdx = rows.findIndex(r => r && r.filter(c => c !== null && c !== '').length >= 2);
  if (hIdx < 0) hIdx = 0;
  const header = (rows[hIdx] || []).map(c => c === null ? '' : String(c));
  const data = rows.slice(hIdx + 1).filter(r => r && r.some(c => c !== null && c !== ''));
  // עמודת תווית = ראשונה טקסטואלית; עמודת ערך = ראשונה מספרית
  let li = -1, vi = -1;
  for (let c = 0; c < header.length; c++) {
    const sample = data.slice(0, 30).map(r => r[c]).filter(v => v !== null && v !== '');
    if (!sample.length) continue;
    const numeric = sample.filter(v => !isNaN(num(v)) && num(v) !== 0 || String(v).trim() === '0').length / sample.length > .7;
    if (!numeric && li < 0) li = c;
    if (numeric && vi < 0 && c !== li) vi = c;
  }
  let agg = null;
  if (li >= 0 && vi >= 0) {
    const m = new Map();
    for (const r of data) {
      const k = r[li];
      if (k === null || k === '') continue;
      m.set(String(k), (m.get(String(k)) || 0) + num(r[vi]));
    }
    agg = { label: header[li] || 'קטגוריה', value: header[vi] || 'ערך',
            items: [...m.entries()].map(([name, v]) => ({ name, val: v })).sort((a, b) => b.val - a.val) };
  }
  return { kind: 'generic', fileName, sheetName: name, header, rowCount: data.length, agg,
           sampleRows: data.slice(0, 80) };
}

/* ============================================================
   מנוע גרפים — SVG בכתיבה ידנית, RTL
   רוחב קבוע 1140 × גובה 470 בתוך שקף 1280×720
   ============================================================ */
const CW = 1140, CH = 470;

function makeChartWrap(body) {
  const wrap = el('div', 'chart-wrap');
  body.appendChild(wrap);
  const tip = el('div', 'viz-tooltip');
  wrap.appendChild(tip);
  return { wrap, tip };
}
function showTip(tip, wrap, x, y, title, rows) {
  tip.textContent = '';
  const t = el('div', 'tt-title', title);
  tip.appendChild(t);
  for (const r of rows) {
    const row = el('div', 'tt-row');
    if (r.color) { const k = el('span', 'tt-key'); k.style.background = r.color; row.appendChild(k); }
    const b = el('b', null, r.value);
    const s = el('span', null, r.label);
    row.appendChild(b); row.appendChild(s);
    tip.appendChild(row);
  }
  tip.style.opacity = '1';
  const W = wrap.clientWidth || CW;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let px = x - tw / 2;
  px = Math.max(4, Math.min(px, W - tw - 4));
  let py = y - th - 14;
  if (py < 0) py = y + 18;
  tip.style.left = px + 'px';
  tip.style.top = py + 'px';
}
function hideTip(tip) { tip.style.opacity = '0'; }

/* עמודות אנכיות — ציר זמן מימין לשמאל (RTL) */
function columnChart(body, opts) {
  // opts: {labels, values, fmt, fmtAxis, seriesColor, highlight: idx->bool, tooltipExtra: i=>[{label,value}]}
  const { wrap, tip } = makeChartWrap(body);
  const svg = svgEl('svg', { viewBox: `0 0 ${CW} ${CH}`, preserveAspectRatio: 'xMidYMid meet' });
  wrap.appendChild(svg);
  const padTop = 34, padBottom = 46, padRight = 14, padLeft = 78;
  const plotW = CW - padRight - padLeft, plotH = CH - padTop - padBottom;
  const n = opts.values.length;
  const { max, ticks } = niceTicks(Math.max(...opts.values));
  const y = v => padTop + plotH - (v / max) * plotH;
  const bandW = plotW / n;
  const barW = Math.min(24, bandW * .55);
  const color = opts.seriesColor || css('--series-1');
  const fmt = opts.fmt || (v => fmtInt.format(v));
  const fmtAxis = opts.fmtAxis || (v => fmtCompact.format(v));

  // רשת אופקית + ערכי ציר בצד ימין... (בעברית — הציר בימין)
  for (const t of ticks) {
    svg.appendChild(svgEl('line', { x1: padRight, x2: CW - padLeft, y1: y(t), y2: y(t),
      stroke: t === 0 ? css('--baseline') : css('--grid'), 'stroke-width': 1 }));
    const lbl = svgEl('text', { x: CW - padLeft + 10, y: y(t) + 4, 'font-size': 13,
      fill: css('--muted'), 'text-anchor': 'start' });
    lbl.textContent = fmtAxis(t);
    svg.appendChild(lbl);
  }

  opts.values.forEach((v, i) => {
    // RTL: הפריט הראשון בימין
    const cx = CW - padLeft - bandW * i - bandW / 2;
    const x0 = cx - barW / 2;
    const barTop = y(v), barH = Math.max(0, padTop + plotH - barTop);
    const c = (opts.highlight && opts.highlight(i)) ? css('--series-2') : color;
    const r = Math.min(4, barH); // קצה עליון מעוגל, בסיס ישר
    const d = `M ${x0} ${padTop + plotH} V ${barTop + r} Q ${x0} ${barTop} ${x0 + r} ${barTop} H ${x0 + barW - r} Q ${x0 + barW} ${barTop} ${x0 + barW} ${barTop + r} V ${padTop + plotH} Z`;
    const bar = svgEl('path', { d, fill: c });
    svg.appendChild(bar);

    // תווית ערך על הכיפה
    if (n <= 12) {
      const val = svgEl('text', { x: cx, y: barTop - 8, 'font-size': 13.5, 'font-weight': 700,
        fill: css('--ink-2'), 'text-anchor': 'middle' });
      val.textContent = fmt(v);
      svg.appendChild(val);
    }
    // תווית קטגוריה
    const cat = svgEl('text', { x: cx, y: padTop + plotH + 24, 'font-size': 13.5,
      fill: css('--ink-2'), 'text-anchor': 'middle' });
    cat.textContent = opts.labels[i];
    svg.appendChild(cat);

    // אזור פגיעה לעכבר — כל רוחב הרצועה
    const hit = svgEl('rect', { x: cx - bandW / 2, y: padTop, width: bandW, height: plotH, fill: 'transparent' });
    hit.style.cursor = 'default';
    hit.addEventListener('pointermove', () => {
      bar.setAttribute('fill-opacity', '0.82');
      const rows = [{ label: '', value: fmt(v), color: c }];
      if (opts.tooltipExtra) rows.push(...opts.tooltipExtra(i));
      const scale = wrap.clientWidth / CW;
      showTip(tip, wrap, cx * scale, barTop * scale, opts.labels[i], rows);
    });
    hit.addEventListener('pointerleave', () => { bar.removeAttribute('fill-opacity'); hideTip(tip); });
    svg.appendChild(hit);
  });
  return svg;
}

/* עמודות מקובצות — כמה סדרות זו לצד זו, עם מקרא */
function groupedColumnChart(body, opts) {
  // opts: {labels, series: [{name, values, color}], fmt, fmtAxis}
  const { wrap, tip } = makeChartWrap(body);

  // מקרא — חובה כשיש יותר מסדרה אחת
  const legend = el('div', 'legend');
  for (const s of opts.series) {
    const item = el('div', 'lg-item');
    const sw = el('span', 'lg-swatch');
    sw.style.background = s.color;
    item.appendChild(sw);
    item.appendChild(el('span', null, s.name));
    legend.appendChild(item);
  }
  wrap.appendChild(legend);

  const svg = svgEl('svg', { viewBox: `0 0 ${CW} ${CH}`, preserveAspectRatio: 'xMidYMid meet' });
  wrap.appendChild(svg);
  const padTop = 42, padBottom = 46, padRight = 14, padLeft = 78;
  const plotW = CW - padRight - padLeft, plotH = CH - padTop - padBottom;
  const n = opts.labels.length, k = opts.series.length;
  const allMax = Math.max(...opts.series.flatMap(s => s.values));
  const { max, ticks } = niceTicks(allMax);
  const y = v => padTop + plotH - (v / max) * plotH;
  const bandW = plotW / n;
  const barW = Math.min(24, (bandW * 0.7 - (k - 1) * 2) / k);
  const groupW = barW * k + (k - 1) * 2; // רווח 2px בצבע הרקע בין עמודות צמודות
  const fmt = opts.fmt || (v => fmtInt.format(v));
  const fmtAxis = opts.fmtAxis || (v => fmtCompact.format(v));

  for (const t of ticks) {
    svg.appendChild(svgEl('line', { x1: padRight, x2: CW - padLeft, y1: y(t), y2: y(t),
      stroke: t === 0 ? css('--baseline') : css('--grid'), 'stroke-width': 1 }));
    const lbl = svgEl('text', { x: CW - padLeft + 10, y: y(t) + 4, 'font-size': 13,
      fill: css('--muted'), 'text-anchor': 'start' });
    lbl.textContent = fmtAxis(t);
    svg.appendChild(lbl);
  }

  opts.labels.forEach((label, i) => {
    const cx = CW - padLeft - bandW * i - bandW / 2; // RTL: קבוצה ראשונה בימין
    const bars = [];
    opts.series.forEach((s, si) => {
      // בתוך הקבוצה: הסדרה הראשונה בימין
      const x0 = cx + groupW / 2 - (si + 1) * barW - si * 2;
      const v = s.values[i];
      const barTop = y(v), barH = Math.max(0, padTop + plotH - barTop);
      const r = Math.min(4, barH, barW / 2);
      const d = `M ${x0} ${padTop + plotH} V ${barTop + r} Q ${x0} ${barTop} ${x0 + r} ${barTop} H ${x0 + barW - r} Q ${x0 + barW} ${barTop} ${x0 + barW} ${barTop + r} V ${padTop + plotH} Z`;
      const bar = svgEl('path', { d, fill: s.color });
      svg.appendChild(bar);
      bars.push(bar);
      if (n * k <= 15) {
        const val = svgEl('text', { x: x0 + barW / 2, y: barTop - 7, 'font-size': 12.5, 'font-weight': 700,
          fill: css('--ink-2'), 'text-anchor': 'middle' });
        val.textContent = fmt(v);
        svg.appendChild(val);
      }
    });
    const cat = svgEl('text', { x: cx, y: padTop + plotH + 24, 'font-size': 13.5,
      fill: css('--ink-2'), 'text-anchor': 'middle' });
    cat.textContent = label;
    svg.appendChild(cat);

    const hit = svgEl('rect', { x: cx - bandW / 2, y: padTop, width: bandW, height: plotH, fill: 'transparent' });
    hit.addEventListener('pointermove', () => {
      bars.forEach(b => b.setAttribute('fill-opacity', '0.85'));
      const scale = wrap.clientWidth / CW;
      const topY = Math.min(...opts.series.map(s => y(s.values[i])));
      showTip(tip, wrap, cx * scale, topY * scale, label,
        opts.series.map(s => ({ label: s.name, value: fmt(s.values[i]), color: s.color })));
    });
    hit.addEventListener('pointerleave', () => { bars.forEach(b => b.removeAttribute('fill-opacity')); hideTip(tip); });
    svg.appendChild(hit);
  });
  return svg;
}

/* עמודות אופקיות — קטגוריות בימין, עמודה גדלה שמאלה */
function barChartH(body, opts) {
  // opts: {items:[{name, val, extra}], fmt, fmtAxis, seriesColor, noteFn}
  const { wrap, tip } = makeChartWrap(body);
  const svg = svgEl('svg', { viewBox: `0 0 ${CW} ${CH}`, preserveAspectRatio: 'xMidYMid meet' });
  wrap.appendChild(svg);
  const items = opts.items;
  const n = items.length;
  const labelW = 300, padLeft = 90, padTop = 8, padBottom = 30;
  const plotW = CW - labelW - padLeft, plotH = CH - padTop - padBottom;
  const x0 = CW - labelW; // בסיס בימין
  const { max, ticks } = niceTicks(Math.max(...items.map(d => d.val)));
  const w = v => (v / max) * plotW;
  const bandH = plotH / n;
  const barH = Math.min(24, bandH * .6);
  const color = opts.seriesColor || css('--series-1');
  const fmt = opts.fmt || (v => fmtInt.format(v));
  const fmtAxis = opts.fmtAxis || (v => fmtCompact.format(v));

  // רשת אנכית
  for (const t of ticks) {
    const xx = x0 - w(t);
    svg.appendChild(svgEl('line', { x1: xx, x2: xx, y1: padTop, y2: padTop + plotH,
      stroke: t === 0 ? css('--baseline') : css('--grid'), 'stroke-width': 1 }));
    const lbl = svgEl('text', { x: xx, y: padTop + plotH + 20, 'font-size': 12.5,
      fill: css('--muted'), 'text-anchor': 'middle' });
    lbl.textContent = fmtAxis(t);
    svg.appendChild(lbl);
  }

  items.forEach((d, i) => {
    const cy = padTop + bandH * i + bandH / 2;
    const y0 = cy - barH / 2;
    const bw = w(d.val);
    const r = Math.min(4, bw);
    // קצה נתונים מעוגל בשמאל, בסיס ישר בימין
    const path = `M ${x0} ${y0} H ${x0 - bw + r} Q ${x0 - bw} ${y0} ${x0 - bw} ${y0 + r} V ${y0 + barH - r} Q ${x0 - bw} ${y0 + barH} ${x0 - bw + r} ${y0 + barH} H ${x0} Z`;
    const bar = svgEl('path', { d: path, fill: color });
    svg.appendChild(bar);

    // שם קטגוריה בימין — חיתוך בגבול מילה שלמה
    let name = d.name;
    if (name.length > 34) {
      name = name.slice(0, 34);
      const sp = name.lastIndexOf(' ');
      if (sp > 14) name = name.slice(0, sp);
      name = name.trim() + '…';
    }
    const cat = svgEl('text', { x: x0 + 12, y: cy + 4.5, 'font-size': 14, 'font-weight': 600,
      fill: css('--ink'), 'text-anchor': 'start' });
    cat.textContent = name;
    svg.appendChild(cat);

    // ערך בקצה העמודה
    const val = svgEl('text', { x: x0 - bw - 8, y: cy + 4.5, 'font-size': 13, 'font-weight': 700,
      fill: css('--ink-2'), 'text-anchor': 'end' });
    val.textContent = fmt(d.val);
    svg.appendChild(val);

    const hit = svgEl('rect', { x: 0, y: padTop + bandH * i, width: CW, height: bandH, fill: 'transparent' });
    hit.addEventListener('pointermove', () => {
      bar.setAttribute('fill-opacity', '0.82');
      const rows = [{ label: '', value: fmt(d.val), color }];
      if (d.extra) rows.push(...d.extra);
      const scale = wrap.clientWidth / CW;
      showTip(tip, wrap, (x0 - bw / 2) * scale, y0 * scale, d.name, rows);
    });
    hit.addEventListener('pointerleave', () => { bar.removeAttribute('fill-opacity'); hideTip(tip); });
    svg.appendChild(hit);
  });
  return svg;
}

/* גרף קו — לאחוזים / מגמה */
function lineChart(body, opts) {
  // opts: {labels, values, fmt, domainMin}
  const { wrap, tip } = makeChartWrap(body);
  const svg = svgEl('svg', { viewBox: `0 0 ${CW} ${CH}`, preserveAspectRatio: 'xMidYMid meet' });
  wrap.appendChild(svg);
  const padTop = 30, padBottom = 46, padRight = 60, padLeft = 78;
  const plotW = CW - padRight - padLeft, plotH = CH - padTop - padBottom;
  const n = opts.values.length;
  const vMax = Math.max(...opts.values), vMin = Math.min(...opts.values);
  let domainMin = opts.domainMin !== undefined ? opts.domainMin : 0;
  if (vMin < domainMin) domainMin = Math.floor(vMin); // אף נקודה לא יורדת מתחת לציר
  const top = Math.min(100, Math.ceil(vMax + (vMax - domainMin) * .1));
  const y = v => padTop + plotH - ((v - domainMin) / (top - domainMin || 1)) * plotH;
  const x = i => CW - padLeft - (plotW / (n - 1 || 1)) * i; // RTL
  const color = css('--series-1');
  const fmt = opts.fmt || (v => fmtInt.format(v));

  const tickCount = 5;
  for (let k = 0; k <= tickCount; k++) {
    const t = domainMin + ((top - domainMin) / tickCount) * k;
    svg.appendChild(svgEl('line', { x1: padRight, x2: CW - padLeft, y1: y(t), y2: y(t),
      stroke: k === 0 ? css('--baseline') : css('--grid'), 'stroke-width': 1 }));
    const lbl = svgEl('text', { x: CW - padLeft + 10, y: y(t) + 4, 'font-size': 13,
      fill: css('--muted'), 'text-anchor': 'start' });
    lbl.textContent = fmt(t);
    svg.appendChild(lbl);
  }

  // קו
  let d = '';
  opts.values.forEach((v, i) => { d += (i ? ' L ' : 'M ') + x(i) + ' ' + y(v); });
  svg.appendChild(svgEl('path', { d, fill: 'none', stroke: color, 'stroke-width': 2,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

  // נקודות עם טבעת לבנה + תוויות
  opts.values.forEach((v, i) => {
    svg.appendChild(svgEl('circle', { cx: x(i), cy: y(v), r: 7, fill: color,
      stroke: css('--slide-surface'), 'stroke-width': 2 }));
    const val = svgEl('text', { x: x(i), y: y(v) - 15, 'font-size': 14, 'font-weight': 700,
      fill: css('--ink-2'), 'text-anchor': 'middle' });
    val.textContent = fmt(v);
    svg.appendChild(val);
    const cat = svgEl('text', { x: x(i), y: padTop + plotH + 24, 'font-size': 13.5,
      fill: css('--ink-2'), 'text-anchor': 'middle' });
    cat.textContent = opts.labels[i];
    svg.appendChild(cat);
  });

  // שכבת ריחוף — צלב מציאת X קרוב
  const cross = svgEl('line', { y1: padTop, y2: padTop + plotH, stroke: css('--baseline'),
    'stroke-width': 1, opacity: 0 });
  svg.insertBefore(cross, svg.firstChild);
  const hitAll = svgEl('rect', { x: padRight, y: padTop, width: plotW, height: plotH, fill: 'transparent' });
  hitAll.addEventListener('pointermove', ev => {
    const rect = svg.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) * (CW / rect.width);
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++) { const dd = Math.abs(x(i) - mx); if (dd < bd) { bd = dd; best = i; } }
    cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best));
    cross.setAttribute('opacity', '1');
    const scale = wrap.clientWidth / CW;
    showTip(tip, wrap, x(best) * scale, y(opts.values[best]) * scale, opts.labels[best],
      [{ label: opts.seriesName || '', value: fmt(opts.values[best]), color }]);
  });
  hitAll.addEventListener('pointerleave', () => { cross.setAttribute('opacity', '0'); hideTip(tip); });
  svg.appendChild(hitAll);
  return svg;
}

/* ============================================================
   בניית שקפים
   ============================================================ */
function slideShell(kicker, title, sub, sectionName) {
  const s = el('section', 'slide');
  const head = el('div', 's-head');
  if (kicker) head.appendChild(el('div', 's-kicker', kicker));
  const h2 = el('h2', null, title);
  head.appendChild(h2);
  if (sub) head.appendChild(el('div', 's-sub', sub));
  s.appendChild(head);
  const body = el('div', 's-body');
  s.appendChild(body);
  const foot = el('div', 's-foot');
  const brand = el('span', 'foot-brand');
  const fimg = el('img');
  fimg.src = 'novolog-logo.png';
  fimg.alt = 'Novolog';
  brand.appendChild(fimg);
  brand.appendChild(el('span', null, 'מערכת הגרפים'));
  foot.appendChild(brand);
  const pageNum = el('span', 'page-num', '');
  foot.appendChild(pageNum);
  s.appendChild(foot);
  return { s, body, title, sectionName };
}

function coverKicker() {
  const k = el('div', 'cover-kicker');
  const img = el('img');
  img.src = 'novolog-logo.png';
  img.alt = 'Novolog';
  k.appendChild(img);
  return k;
}

function addTableToggle(body, head, rows) {
  const btn = el('button', 'tbl-btn', 'הצג טבלה');
  const overlay = el('div', 'table-overlay');
  const table = el('table');
  const thead = el('thead'); const trh = el('tr');
  head.forEach(h => trh.appendChild(el('th', null, h)));
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = el('tbody');
  rows.forEach(r => {
    const tr = el('tr');
    r.forEach((c, i) => {
      const td = el('td', typeof c === 'number' ? 'num' : null,
        typeof c === 'number' ? fmtInt.format(c) : String(c));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  overlay.appendChild(table);
  body.appendChild(overlay);
  body.appendChild(btn);
  btn.addEventListener('click', () => {
    const show = !overlay.classList.contains('show');
    overlay.classList.toggle('show', show);
    btn.textContent = show ? 'הצג גרף' : 'הצג טבלה';
  });
}

function kpiRow(body, kpis) {
  const row = el('div', 'kpi-row');
  kpis.forEach(k => {
    const t = el('div', 'kpi');
    t.appendChild(el('div', 'k-label', k.label));
    t.appendChild(el('div', 'k-value', k.value));
    if (k.note) t.appendChild(el('div', 'k-note', k.note));
    row.appendChild(t);
  });
  body.appendChild(row);
  return row;
}

/* --- שקף פתיחה ממותג (Novolog Logistics) --- */
function buildBrandCoverSlide(datasets) {
  const s = el('section', 'slide brand-cover');

  const hero = el('div', 'bc-hero');
  hero.setAttribute('dir', 'ltr');
  const logo = el('img');
  logo.src = 'novolog-logo-white.png';
  logo.alt = 'Novolog';
  hero.appendChild(logo);
  s.appendChild(hero);

  const title = el('div', 'bc-title');
  title.appendChild(el('h2', null, 'מצגת נתונים'));
  const names = datasets.map(d =>
    d.kind === 'damaged' ? 'העברות למחסן פגומים' :
    d.kind === 'inventory' ? 'ספירות מלאי' :
    d.kind === 'calls' ? 'קריאות שירות' :
    d.fileName.replace(/\.(xlsx|xls|xlsm|csv)$/i, ''));
  const dateStr = new Date().toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
  title.appendChild(el('div', 'bc-sub', [...new Set(names)].join(' · ')));
  title.appendChild(el('div', 'bc-sub', 'הופק בתאריך ' + dateStr));
  s.appendChild(title);

  const band = el('div', 'bc-band');
  band.setAttribute('dir', 'ltr');
  band.setAttribute('aria-hidden', 'true');
  ['bb-yellow', 'bb-green', 'bb-blue'].forEach(c => band.appendChild(el('div', c)));
  s.appendChild(band);

  return { s, title: 'שער ראשי', sectionName: 'פתיחה' };
}

/* --- שקפים לדוח פגומים --- */
function buildDamagedSlides(d, sectionTitle) {
  const slides = [];
  const section = sectionTitle || 'העברות למחסן פגומים';
  const period = periodLabel(d.months);

  // שער
  {
    const { s } = slideShell(null, '', '', section);
    s.classList.add('cover');
    s.querySelector('.s-head').remove();
    s.querySelector('.s-body').remove();
    const wrap = el('div');
    wrap.appendChild(coverKicker());
    wrap.appendChild(el('h2', null, section));
    const sub = el('div', 's-sub', period);
    wrap.appendChild(sub);
    const kpis = el('div', 'kpi-row');
    wrap.appendChild(kpis);
    s.insertBefore(wrap, s.querySelector('.s-foot'));
    const row = [
      { label: 'שווי העברות כולל (SUM)', value: nisCompact(d.sumTotal), note: 'לפי מחירון יַרְפָּא' },
      { label: 'שווי פגומים (פירוט)', value: nisCompact(d.detail.val), note: fmtInt.format(d.detail.rows) + ' שורות פריט' },
      { label: 'כמות יחידות פגומות', value: fmtCompact.format(d.detail.qty), note: '' },
    ];
    if (d.dest) row.push({ label: 'שווי השמדות', value: nisCompact(d.dest.total), note: fmtInt.format(d.dest.rows) + ' שורות' });
    row.forEach(k => {
      const t = el('div', 'kpi');
      t.appendChild(el('div', 'k-label', k.label));
      t.appendChild(el('div', 'k-value', k.value));
      if (k.note) t.appendChild(el('div', 'k-note', k.note));
      kpis.appendChild(t);
    });
    slides.push({ s, title: section + ' — שער', sectionName: section });
  }

  // שווי לפי חודש
  {
    const sh = slideShell(section, 'שווי העברות לפי חודש', 'סכום בש"ח לפי מחירון, מגיליון SUM · ' + period, section);
    const maxIdx = d.sumByMonth.reduce((bi, r, i, a) => r.nis > a[bi].nis ? i : bi, 0);
    columnChart(sh.body, {
      labels: d.sumByMonth.map(r => monthLabel(r.m)),
      values: d.sumByMonth.map(r => r.nis),
      fmt: nisCompact, fmtAxis: v => fmtCompact.format(v),
      highlight: i => i === maxIdx,
      tooltipExtra: i => [{ label: 'יחידות', value: fmtInt.format(d.sumByMonth[i].qty) }],
    });
    addTableToggle(sh.body, ['חודש', 'שווי (₪)', 'יחידות'],
      d.sumByMonth.map(r => [monthLabel(r.m), Math.round(r.nis), r.qty]));
    slides.push(sh);
  }

  // סיבות מובילות
  {
    const top = d.reasons.slice(0, 10);
    const rest = d.reasons.slice(10);
    const items = top.map(r => ({ name: r.name, val: r.nis, extra: [{ label: 'יחידות', value: fmtInt.format(r.qty) }] }));
    if (rest.length) items.push({ name: 'אחר (' + rest.length + ' סיבות)', val: rest.reduce((s, r) => s + r.nis, 0) });
    const sh = slideShell(section, 'עשר הסיבות המובילות להעברה', 'לפי שווי בש"ח · ' + period, section);
    barChartH(sh.body, { items, fmt: nisCompact });
    addTableToggle(sh.body, ['סיבה', 'שווי (₪)', 'יחידות'],
      d.reasons.map(r => [r.name, Math.round(r.nis), r.qty]));
    slides.push(sh);
  }

  // פריטים מובילים
  {
    const top = d.detail.topItems.slice(0, 10);
    const sh = slideShell(section, 'עשרת הפריטים הפגומים המובילים', 'לפי שווי בש"ח, מגיליון הפירוט · ' + period, section);
    barChartH(sh.body, {
      items: top.map(r => ({ name: r.name, val: r.val, extra: [{ label: 'יחידות', value: fmtInt.format(r.qty) }] })),
      fmt: nisCompact,
    });
    addTableToggle(sh.body, ['פריט', 'שווי (₪)', 'יחידות'],
      d.detail.topItems.slice(0, 40).map(r => [r.name, Math.round(r.val), r.qty]));
    slides.push(sh);
  }

  // פגומים לפי סיבה (פירוט)
  {
    const top = d.detail.byReason.slice(0, 10);
    const rest = d.detail.byReason.slice(10);
    const items = top.map(r => ({ name: r.name, val: r.val, extra: [{ label: 'יחידות', value: fmtInt.format(r.qty) }] }));
    if (rest.length) items.push({ name: 'אחר (' + rest.length + ' סיבות)', val: rest.reduce((s, r) => s + r.val, 0) });
    const sh = slideShell(section, 'פגומים לפי סיבה', 'שווי בש"ח מגיליון הפירוט · ' + period, section);
    barChartH(sh.body, { items, fmt: nisCompact });
    addTableToggle(sh.body, ['סיבה', 'שווי (₪)', 'יחידות'],
      d.detail.byReason.map(r => [r.name, Math.round(r.val), r.qty]));
    slides.push(sh);
  }

  // השמדות לפי חודש
  if (d.dest) {
    const sh = slideShell(section, 'השמדות לפי חודש', 'שווי בש"ח (כמות × מחיר) · ' + periodLabel(d.dest.byMonth.map(r => r.m)), section);
    columnChart(sh.body, {
      labels: d.dest.byMonth.map(r => monthLabel(r.m)),
      values: d.dest.byMonth.map(r => r.nis),
      fmt: nisCompact,
      seriesColor: css('--series-3'),
      tooltipExtra: i => [
        { label: 'יחידות', value: fmtInt.format(d.dest.byMonth[i].qty) },
        { label: 'שורות', value: fmtInt.format(d.dest.byMonth[i].rows) },
      ],
    });
    addTableToggle(sh.body, ['חודש', 'שווי (₪)', 'יחידות', 'שורות'],
      d.dest.byMonth.map(r => [monthLabel(r.m), Math.round(r.nis), r.qty, r.rows]));
    slides.push(sh);
  }
  return slides;
}

/* --- שקפים לדוח ספירות מלאי --- */
function buildInventorySlides(d, sectionTitle) {
  const slides = [];
  const section = sectionTitle || 'ספירות מלאי';
  const period = periodLabel(d.months);
  const accuracy = 100 * (1 - d.diffRows / d.total);

  // שער
  {
    const { s } = slideShell(null, '', '', section);
    s.classList.add('cover');
    s.querySelector('.s-head').remove();
    s.querySelector('.s-body').remove();
    const wrap = el('div');
    wrap.appendChild(coverKicker());
    wrap.appendChild(el('h2', null, section));
    wrap.appendChild(el('div', 's-sub', period));
    const kpis = el('div', 'kpi-row');
    [
      { label: 'סה"כ ספירות', value: fmtInt.format(d.total), note: period },
      { label: 'ספירות עם הפרש', value: fmtInt.format(d.diffRows), note: fmtPct(100 * d.diffRows / d.total) + ' מהספירות' },
      { label: 'דיוק ספירה', value: fmtPct(accuracy), note: 'ספירות ללא הפרש' },
      { label: 'כמות הפרש מוחלטת', value: fmtCompact.format(d.absQty), note: 'יחידות' },
    ].forEach(k => {
      const t = el('div', 'kpi');
      t.appendChild(el('div', 'k-label', k.label));
      t.appendChild(el('div', 'k-value', k.value));
      if (k.note) t.appendChild(el('div', 'k-note', k.note));
      kpis.appendChild(t);
    });
    wrap.appendChild(kpis);
    s.insertBefore(wrap, s.querySelector('.s-foot'));
    slides.push({ s, title: section + ' — שער', sectionName: section });
  }

  // ספירות לפי חודש
  {
    const sh = slideShell(section, 'מספר ספירות לפי חודש', period, section);
    columnChart(sh.body, {
      labels: d.byMonth.map(r => monthLabel(r.m)),
      values: d.byMonth.map(r => r.counts),
      fmt: v => fmtInt.format(v), fmtAxis: v => fmtCompact.format(v),
      tooltipExtra: i => [{ label: 'מתוכן עם הפרש', value: fmtInt.format(d.byMonth[i].diffRows) }],
    });
    addTableToggle(sh.body, ['חודש', 'ספירות', 'עם הפרש', 'כמות הפרש מוחלטת'],
      d.byMonth.map(r => [monthLabel(r.m), r.counts, r.diffRows, r.absQty]));
    slides.push(sh);
  }

  // ספירות עם הפרש לפי חודש
  {
    const sh = slideShell(section, 'ספירות עם הפרש לפי חודש', 'מספר ספירות שבהן נמצא פער בין הספירה לספרים · ' + period, section);
    columnChart(sh.body, {
      labels: d.byMonth.map(r => monthLabel(r.m)),
      values: d.byMonth.map(r => r.diffRows),
      fmt: v => fmtInt.format(v),
      seriesColor: css('--series-2'),
      tooltipExtra: i => [
        { label: 'מכלל הספירות בחודש', value: fmtPct(100 * d.byMonth[i].diffRows / d.byMonth[i].counts) },
        { label: 'כמות הפרש מוחלטת', value: fmtInt.format(d.byMonth[i].absQty) },
      ],
    });
    addTableToggle(sh.body, ['חודש', 'ספירות עם הפרש', '% מהספירות', 'כמות הפרש מוחלטת'],
      d.byMonth.map(r => [monthLabel(r.m), r.diffRows, Math.round(1000 * r.diffRows / r.counts) / 10 + '%', r.absQty]));
    slides.push(sh);
  }

  // דיוק לפי חודש
  {
    const accVals = d.byMonth.map(r => Math.round(1000 * (1 - r.diffRows / r.counts)) / 10);
    const axisMin = Math.min(90, Math.floor(Math.min(...accVals)));
    const sh = slideShell(section, 'דיוק ספירה לפי חודש', 'אחוז הספירות ללא הפרש (ציר מ־' + axisMin + '%) · ' + period, section);
    lineChart(sh.body, {
      labels: d.byMonth.map(r => monthLabel(r.m)),
      values: accVals,
      fmt: v => v.toLocaleString('he-IL', { maximumFractionDigits: 1 }) + '%',
      domainMin: 90,
      seriesName: 'דיוק',
    });
    addTableToggle(sh.body, ['חודש', 'ספירות', 'ללא הפרש', 'דיוק'],
      d.byMonth.map(r => [monthLabel(r.m), r.counts, r.counts - r.diffRows,
        (Math.round(1000 * (1 - r.diffRows / r.counts)) / 10) + '%']));
    slides.push(sh);
  }

  // לפי סיבה
  {
    const sh = slideShell(section, 'ספירות לפי סיבה', period, section);
    barChartH(sh.body, {
      items: d.byReason.map(r => ({ name: r.name, val: r.counts,
        extra: [{ label: 'עם הפרש', value: fmtInt.format(r.diffRows) }] })),
      fmt: v => fmtInt.format(v),
    });
    addTableToggle(sh.body, ['סיבה', 'ספירות', 'עם הפרש'],
      d.byReason.map(r => [r.name, r.counts, r.diffRows]));
    slides.push(sh);
  }

  // לפי אזור פעילות
  {
    const areas = d.byArea.filter(a => a.counts >= 10);
    const sh = slideShell(section, 'הפרשים לפי אזור פעילות', 'אחוז הספירות עם הפרש בכל אזור (אזורים עם 10+ ספירות) · ' + period, section);
    barChartH(sh.body, {
      items: areas.map(a => ({ name: a.name, val: Math.round(1000 * a.diffRows / a.counts) / 10,
        extra: [
          { label: 'ספירות', value: fmtInt.format(a.counts) },
          { label: 'עם הפרש', value: fmtInt.format(a.diffRows) },
        ] })).sort((a, b) => b.val - a.val),
      fmt: v => v.toLocaleString('he-IL', { maximumFractionDigits: 1 }) + '%',
      fmtAxis: v => v + '%',
      seriesColor: css('--series-2'),
    });
    addTableToggle(sh.body, ['אזור', 'ספירות', 'עם הפרש', '% הפרש'],
      d.byArea.map(a => [a.name, a.counts, a.diffRows, (Math.round(1000 * a.diffRows / a.counts) / 10) + '%']));
    slides.push(sh);
  }
  return slides;
}

/* --- שקפים לדוח קריאות שירות --- */
function buildServiceCallsSlides(d, sectionTitle) {
  const slides = [];
  const section = sectionTitle || 'קריאות שירות';
  const period = periodLabel(d.months);
  const just = d.justTotals['מוצדק'] || 0;
  const unjust = d.justTotals['לא מוצדק'] || 0;
  const justPct = just + unjust ? 100 * just / (just + unjust) : 0;
  const SERIES_COLORS = [css('--series-1'), css('--series-2'), css('--series-3')];

  // שער
  {
    const { s } = slideShell(null, '', '', section);
    s.classList.add('cover');
    s.querySelector('.s-head').remove();
    s.querySelector('.s-body').remove();
    const wrap = el('div');
    wrap.appendChild(coverKicker());
    wrap.appendChild(el('h2', null, section));
    wrap.appendChild(el('div', 's-sub', period));
    const kpis = el('div', 'kpi-row');
    [
      { label: 'סה"כ קריאות', value: fmtInt.format(d.totalCalls), note: fmtInt.format(d.totalLines) + ' שורות פריט' },
      { label: 'קריאות מוצדקות', value: fmtInt.format(just), note: fmtPct(justPct) + ' מהקריאות המסווגות' },
      { label: 'קריאות לא מוצדקות', value: fmtInt.format(unjust), note: '' },
      { label: 'קריאות שירות', value: fmtInt.format(d.justTotals['שירות'] || 0), note: 'ללא סיווג הצדקה' },
    ].forEach(k => {
      const t = el('div', 'kpi');
      t.appendChild(el('div', 'k-label', k.label));
      t.appendChild(el('div', 'k-value', k.value));
      if (k.note) t.appendChild(el('div', 'k-note', k.note));
      kpis.appendChild(t);
    });
    wrap.appendChild(kpis);
    s.insertBefore(wrap, s.querySelector('.s-foot'));
    slides.push({ s, title: section + ' — שער', sectionName: section });
  }

  // מוצדק מול לא מוצדק לפי חודש
  {
    const sh = slideShell(section, 'קריאות לפי חודש — מוצדק מול לא מוצדק', period, section);
    groupedColumnChart(sh.body, {
      labels: d.byMonth.map(r => monthLabel(r.m)),
      series: d.justKinds.map((k, i) => ({
        name: k,
        values: d.byMonth.map(r => r[k] || 0),
        color: SERIES_COLORS[i % SERIES_COLORS.length],
      })),
      fmt: v => fmtInt.format(v),
    });
    addTableToggle(sh.body, ['חודש', ...d.justKinds, 'סה"כ'],
      d.byMonth.map(r => [monthLabel(r.m), ...d.justKinds.map(k => r[k] || 0),
        d.justKinds.reduce((s2, k) => s2 + (r[k] || 0), 0)]));
    slides.push(sh);
  }

  // אחוז מוצדקות לפי חודש
  {
    const vals = d.byMonth.map(r => {
      const j = r['מוצדק'] || 0, u = r['לא מוצדק'] || 0;
      return j + u ? Math.round(1000 * j / (j + u)) / 10 : 0;
    });
    const axisMin = Math.max(0, Math.floor(Math.min(...vals) / 10) * 10 - 10);
    const sh = slideShell(section, 'אחוז הקריאות המוצדקות לפי חודש',
      'מתוך הקריאות המסווגות מוצדק/לא מוצדק (ציר מ־' + axisMin + '%) · ' + period, section);
    lineChart(sh.body, {
      labels: d.byMonth.map(r => monthLabel(r.m)),
      values: vals,
      fmt: v => v.toLocaleString('he-IL', { maximumFractionDigits: 1 }) + '%',
      domainMin: axisMin,
      seriesName: 'מוצדקות',
    });
    addTableToggle(sh.body, ['חודש', 'מוצדק', 'לא מוצדק', '% מוצדק'],
      d.byMonth.map((r, i) => [monthLabel(r.m), r['מוצדק'] || 0, r['לא מוצדק'] || 0, vals[i] + '%']));
    slides.push(sh);
  }

  // סיבות מובילות
  {
    const top = d.byReason.slice(0, 10);
    const rest = d.byReason.slice(10);
    const items = top.map(r => ({ name: r.name, val: r.total, extra: [
      { label: 'מוצדק', value: fmtInt.format(r.just) },
      { label: 'לא מוצדק', value: fmtInt.format(r.unjust) },
    ] }));
    if (rest.length) items.push({ name: 'אחר (' + rest.length + ' סיבות)', val: rest.reduce((s2, r) => s2 + r.total, 0) });
    const sh = slideShell(section, 'הסיבות המובילות לקריאות שירות', 'מספר קריאות · ' + period, section);
    barChartH(sh.body, { items, fmt: v => fmtInt.format(v) });
    addTableToggle(sh.body, ['סיבה', 'קריאות', 'מוצדק', 'לא מוצדק'],
      d.byReason.map(r => [r.name, r.total, r.just, r.unjust]));
    slides.push(sh);
  }

  // לקוחות מובילים
  {
    const top = d.byCustomer.slice(0, 10);
    const sh = slideShell(section, 'עשרת הלקוחות המובילים בקריאות', 'מספר קריאות · ' + period, section);
    barChartH(sh.body, {
      items: top.map(r => ({ name: r.name, val: r.total, extra: [
        { label: 'מוצדק', value: fmtInt.format(r.just) },
        { label: 'לא מוצדק', value: fmtInt.format(r.unjust) },
      ] })),
      fmt: v => fmtInt.format(v),
    });
    addTableToggle(sh.body, ['לקוח', 'קריאות', 'מוצדק', 'לא מוצדק'],
      d.byCustomer.slice(0, 40).map(r => [r.name, r.total, r.just, r.unjust]));
    slides.push(sh);
  }

  // סוגי קריאה
  {
    const top = d.byType.slice(0, 10);
    const sh = slideShell(section, 'קריאות לפי סוג', period, section);
    barChartH(sh.body, {
      items: top.map(r => ({ name: r.name, val: r.total, extra: [
        { label: 'מוצדק', value: fmtInt.format(r.just) },
        { label: 'לא מוצדק', value: fmtInt.format(r.unjust) },
      ] })),
      fmt: v => fmtInt.format(v),
      seriesColor: css('--series-3'),
    });
    addTableToggle(sh.body, ['סוג קריאה', 'קריאות', 'מוצדק', 'לא מוצדק'],
      d.byType.map(r => [r.name, r.total, r.just, r.unjust]));
    slides.push(sh);
  }
  return slides;
}

/* --- שקפים לקובץ לא מזוהה --- */
function buildGenericSlides(d) {
  const slides = [];
  const section = d.fileName.replace(/\.(xlsx|xls|xlsm|csv)$/i, '');
  if (d.agg && d.agg.items.length > 1) {
    const top = d.agg.items.slice(0, 12);
    const sh = slideShell(section, d.agg.value + ' לפי ' + d.agg.label,
      'זיהוי אוטומטי · גיליון "' + d.sheetName + '" · ' + fmtInt.format(d.rowCount) + ' שורות', section);
    barChartH(sh.body, { items: top.map(r => ({ name: r.name, val: r.val })), fmt: v => fmtCompact.format(v) });
    addTableToggle(sh.body, [d.agg.label, d.agg.value],
      d.agg.items.slice(0, 60).map(r => [r.name, Math.round(r.val)]));
    slides.push(sh);
  } else {
    const sh = slideShell(section, 'תצוגת נתונים', 'לא זוהה דוח מוכר — מוצגות השורות הראשונות מגיליון "' + d.sheetName + '"', section);
    const overlay = el('div', 'table-overlay show');
    const table = el('table');
    const trh = el('tr');
    d.header.forEach(h => trh.appendChild(el('th', null, h)));
    const thead = el('thead'); thead.appendChild(trh); table.appendChild(thead);
    const tbody = el('tbody');
    d.sampleRows.forEach(r => {
      const tr = el('tr');
      d.header.forEach((_, i) => tr.appendChild(el('td', null, r[i] === null ? '' : String(r[i]))));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    overlay.appendChild(table);
    sh.body.appendChild(overlay);
    slides.push(sh);
  }
  return slides;
}

/* ============================================================
   ייצוא ל-PowerPoint — גרפים חיים (ניתנים לעריכה), לא תמונות
   ============================================================ */
/* טעינת תמונה כ-Data URL לצורך הטמעה בקובץ (null אם לא זמינה) */
function imgToDataURL(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        resolve(c.toDataURL('image/png'));
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

let currentDatasets = [];

async function exportToPptx() {
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';
  const C = { bg: '37485A', brand: '3C4D5C', accent: 'FFCA0F', s1: '2F66A5', s2: 'B8860B', s3: '159D7F',
              ink2: '52616E', muted: '8794A0', grid: 'E7EAEE', green: '3AAB4F', blue: '4BB8E8' };
  const FONT = 'Arial';
  const W = 13.33, H = 7.5;

  const darkLogo = await imgToDataURL('novolog-logo.png'); // לוגו כהה לשקפים לבנים
  const footer = s => {
    if (darkLogo) s.addImage({ data: darkLogo, x: 0.4, y: H - 0.52, w: 0.8, h: 0.34 });
    s.addText('מערכת הגרפים', { x: 1.3, y: H - 0.5, w: 3, h: 0.3, fontSize: 10, color: C.muted, fontFace: FONT, align: 'left' });
  };

  const topBar = s => {
    s.addShape(pptx.ShapeType.rect, { x: W * 0.72, y: 0, w: W * 0.28, h: 0.09, fill: { color: C.accent }, line: { type: 'none' } });
    s.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: W * 0.72, h: 0.09, fill: { color: C.brand }, line: { type: 'none' } });
  };

  function chartSlide(kicker, title) {
    const s = pptx.addSlide();
    topBar(s);
    s.addText(kicker, { x: 0.5, y: 0.22, w: W - 1, h: 0.35, fontSize: 13, color: C.ink2, bold: true, align: 'right', fontFace: FONT, rtlMode: true });
    s.addText(title, { x: 0.5, y: 0.55, w: W - 1, h: 0.6, fontSize: 26, color: C.brand, bold: true, align: 'right', fontFace: FONT, rtlMode: true });
    footer(s);
    return s;
  }

  const AREA = { x: 0.5, y: 1.45, w: W - 1.0, h: 5.35 };
  const baseOpts = {
    ...AREA,
    chartColors: [C.s1],
    catAxisLabelColor: C.ink2, valAxisLabelColor: C.ink2,
    catAxisLabelFontSize: 11, valAxisLabelFontSize: 10,
    catAxisLabelFontFace: FONT, valAxisLabelFontFace: FONT,
    dataLabelFontFace: FONT, dataLabelColor: C.ink2, dataLabelFontSize: 10,
    valGridLine: { color: C.grid, size: 1 }, catGridLine: { style: 'none' },
    showLegend: false, showTitle: false,
  };
  const col = (s, labels, values, o = {}) =>
    s.addChart(pptx.ChartType.bar, [{ name: o.seriesName || 'ערך', labels, values }],
      { ...baseOpts, barDir: 'col', showValue: true, ...o });
  const hbar = (s, items, o = {}) => {
    const rev = [...items].reverse(); // בגרף אופקי הקטגוריה הראשונה למטה — הופכים כדי שהגדול יהיה למעלה
    s.addChart(pptx.ChartType.bar, [{ name: o.seriesName || 'ערך', labels: rev.map(i => i.name), values: rev.map(i => i.val) }],
      { ...baseOpts, barDir: 'bar', showValue: true, ...o });
  };
  const lineP = (s, labels, values, o = {}) =>
    s.addChart(pptx.ChartType.line, [{ name: o.seriesName || 'ערך', labels, values }],
      { ...baseOpts, lineSize: 2, lineDataSymbol: 'circle', lineDataSymbolSize: 8, showValue: true, dataLabelPosition: 't', ...o });

  function kpiBoxes(s, kpis) {
    const bw = 2.85, gap = 0.25;
    const total = kpis.length * bw + (kpis.length - 1) * gap;
    const startR = (W - total) / 2;
    kpis.forEach((k, i) => {
      const bx = W - startR - (i + 1) * bw - i * gap; // RTL: הראשון מימין
      const runs = [
        { text: k.label + '\n', options: { fontSize: 12, color: C.ink2, bold: true, breakLine: true } },
        { text: k.value, options: { fontSize: 26, color: C.brand, bold: true } },
      ];
      if (k.note) runs.push({ text: '\n' + k.note, options: { fontSize: 10, color: C.muted } });
      s.addText(runs, { shape: pptx.ShapeType.roundRect, rectRadius: 0.08,
        fill: { color: 'F6F8FA' }, line: { color: C.grid, width: 1 },
        x: bx, y: 4.3, w: bw, h: 1.9, align: 'center', valign: 'middle', fontFace: FONT, rtlMode: true });
    });
  }

  function sectionCover(title, period, kpis) {
    const s = pptx.addSlide();
    topBar(s);
    if (darkLogo) s.addImage({ data: darkLogo, x: W - 2.15, y: 1.15, w: 1.55, h: 0.66 });
    s.addText(title, { x: 0.6, y: 1.8, w: W - 1.2, h: 1.0, fontSize: 38, color: C.brand, bold: true, align: 'right', fontFace: FONT, rtlMode: true });
    s.addText(period, { x: 0.6, y: 2.9, w: W - 1.2, h: 0.5, fontSize: 18, color: C.ink2, align: 'right', fontFace: FONT, rtlMode: true });
    kpiBoxes(s, kpis);
    footer(s);
  }

  /* ---- שקף פתיחה ממותג ---- */
  const cover = pptx.addSlide();
  cover.background = { color: C.bg };
  const logoData = await imgToDataURL('novolog-logo-white.png');
  if (logoData) cover.addImage({ data: logoData, x: 0.55, y: 0.5, w: 2.55, h: 1.08 });
  cover.addText('מצגת נתונים', { x: 0.6, y: 2.9, w: W - 1.2, h: 1.1, fontSize: 48, color: 'FFFFFF', bold: true, align: 'right', fontFace: FONT, rtlMode: true });
  const secNames = [...new Set(currentDatasets.map(d =>
    d.kind === 'damaged' ? 'העברות למחסן פגומים' :
    d.kind === 'inventory' ? 'ספירות מלאי' :
    d.kind === 'calls' ? 'קריאות שירות' : 'נתונים'))];
  const dateStr = new Date().toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
  cover.addText(secNames.join(' · '), { x: 0.6, y: 4.05, w: W - 1.2, h: 0.5, fontSize: 18, color: 'D9DEE3', align: 'right', fontFace: FONT, rtlMode: true });
  cover.addText('הופק בתאריך ' + dateStr, { x: 0.6, y: 4.5, w: W - 1.2, h: 0.5, fontSize: 14, color: 'AEB9C2', align: 'right', fontFace: FONT, rtlMode: true });
  cover.addShape(pptx.ShapeType.rect, { x: 0, y: H - 1.35, w: W, h: 1.35, fill: { color: 'FFFFFF' }, line: { type: 'none' } });
  cover.addShape(pptx.ShapeType.rect, { x: 0, y: H - 1.12, w: 0.65, h: 1.12, fill: { color: C.accent }, line: { type: 'none' } });
  cover.addShape(pptx.ShapeType.rect, { x: 0.85, y: H - 1.12, w: 2.1, h: 1.12, fill: { color: C.green }, line: { type: 'none' } });
  cover.addShape(pptx.ShapeType.rect, { x: 3.15, y: H - 1.12, w: W - 3.3, h: 1.12, fill: { color: C.blue }, line: { type: 'none' } });

  /* ---- פרקים לפי סוג דוח ---- */
  const kindCounts = {};
  currentDatasets.forEach(d => { kindCounts[d.kind] = (kindCounts[d.kind] || 0) + 1; });
  const baseT = { damaged: 'העברות למחסן פגומים', inventory: 'ספירות מלאי', calls: 'קריאות שירות' };
  const short = (fn, base) => {
    let t = fn.replace(/\.(xlsx|xls|xlsm|csv)$/i, '').trim();
    if (base && t.startsWith(base)) t = t.slice(base.length).trim();
    if (t.length > 32) {
      t = t.slice(0, 32);
      const sp = t.lastIndexOf(' '); // חיתוך בגבול מילה שלמה
      if (sp > 12) t = t.slice(0, sp);
      t = t.trim() + '…';
    }
    return t || fn;
  };
  const M_FMT = '#,##0.0,,"M"', M_AXIS = '#,##0,,"M"', PCT_FMT = '0.0"%"', INT_FMT = '#,##0';

  for (const d of currentDatasets) {
    let sec = baseT[d.kind] || d.fileName.replace(/\.(xlsx|xls|xlsm|csv)$/i, '');
    if (baseT[d.kind] && kindCounts[d.kind] > 1) sec += ' — ' + short(d.fileName, baseT[d.kind]);

    if (d.kind === 'damaged') {
      const period = periodLabel(d.months);
      const kpis = [
        { label: 'שווי העברות כולל (SUM)', value: nisCompact(d.sumTotal), note: 'לפי מחירון יַרְפָּא' },
        { label: 'שווי פגומים (פירוט)', value: nisCompact(d.detail.val), note: fmtInt.format(d.detail.rows) + ' שורות פריט' },
        { label: 'כמות יחידות פגומות', value: fmtCompact.format(d.detail.qty) },
      ];
      if (d.dest) kpis.push({ label: 'שווי השמדות', value: nisCompact(d.dest.total), note: fmtInt.format(d.dest.rows) + ' שורות' });
      sectionCover(sec, period, kpis);

      col(chartSlide(sec, 'שווי העברות לפי חודש (₪)'),
        d.sumByMonth.map(r => monthLabel(r.m)), d.sumByMonth.map(r => Math.round(r.nis)),
        { dataLabelFormatCode: M_FMT, valAxisLabelFormatCode: M_AXIS });

      const reasons = d.reasons.slice(0, 10).map(r => ({ name: r.name, val: Math.round(r.nis) }));
      const restR = d.reasons.slice(10);
      if (restR.length) reasons.push({ name: 'אחר (' + restR.length + ' סיבות)', val: Math.round(restR.reduce((t, r) => t + r.nis, 0)) });
      hbar(chartSlide(sec, 'עשר הסיבות המובילות להעברה (₪)'), reasons,
        { dataLabelFormatCode: M_FMT, valAxisLabelFormatCode: M_AXIS });

      hbar(chartSlide(sec, 'עשרת הפריטים הפגומים המובילים (₪)'),
        d.detail.topItems.slice(0, 10).map(r => ({ name: r.name, val: Math.round(r.val) })),
        { dataLabelFormatCode: '#,##0,"K"', valAxisLabelFormatCode: '#,##0,"K"' });

      const dReasons = d.detail.byReason.slice(0, 10).map(r => ({ name: r.name, val: Math.round(r.val) }));
      const restD = d.detail.byReason.slice(10);
      if (restD.length) dReasons.push({ name: 'אחר (' + restD.length + ' סיבות)', val: Math.round(restD.reduce((t, r) => t + r.val, 0)) });
      hbar(chartSlide(sec, 'פגומים לפי סיבה (₪)'), dReasons,
        { dataLabelFormatCode: '#,##0,"K"', valAxisLabelFormatCode: '#,##0,"K"' });

      if (d.dest) col(chartSlide(sec, 'השמדות לפי חודש (₪)'),
        d.dest.byMonth.map(r => monthLabel(r.m)), d.dest.byMonth.map(r => Math.round(r.nis)),
        { chartColors: [C.s3], dataLabelFormatCode: M_FMT, valAxisLabelFormatCode: M_AXIS });

    } else if (d.kind === 'inventory') {
      const period = periodLabel(d.months);
      const accuracy = 100 * (1 - d.diffRows / d.total);
      sectionCover(sec, period, [
        { label: 'סה"כ ספירות', value: fmtInt.format(d.total), note: period },
        { label: 'ספירות עם הפרש', value: fmtInt.format(d.diffRows), note: fmtPct(100 * d.diffRows / d.total) + ' מהספירות' },
        { label: 'דיוק ספירה', value: fmtPct(accuracy), note: 'ספירות ללא הפרש' },
        { label: 'כמות הפרש מוחלטת', value: fmtCompact.format(d.absQty), note: 'יחידות' },
      ]);

      col(chartSlide(sec, 'מספר ספירות לפי חודש'),
        d.byMonth.map(r => monthLabel(r.m)), d.byMonth.map(r => r.counts),
        { dataLabelFormatCode: INT_FMT });

      col(chartSlide(sec, 'ספירות עם הפרש לפי חודש'),
        d.byMonth.map(r => monthLabel(r.m)), d.byMonth.map(r => r.diffRows),
        { chartColors: [C.s2], dataLabelFormatCode: INT_FMT });

      const accVals = d.byMonth.map(r => Math.round(1000 * (1 - r.diffRows / r.counts)) / 10);
      lineP(chartSlide(sec, 'דיוק ספירה לפי חודש (%)'),
        d.byMonth.map(r => monthLabel(r.m)), accVals,
        { dataLabelFormatCode: PCT_FMT, valAxisMinVal: Math.min(90, Math.floor(Math.min(...accVals))), valAxisMaxVal: 100 });

      hbar(chartSlide(sec, 'ספירות לפי סיבה'),
        d.byReason.map(r => ({ name: r.name, val: r.counts })), { dataLabelFormatCode: INT_FMT });

      hbar(chartSlide(sec, 'הפרשים לפי אזור פעילות (% מהספירות)'),
        d.byArea.filter(a => a.counts >= 10)
          .map(a => ({ name: a.name, val: Math.round(1000 * a.diffRows / a.counts) / 10 }))
          .sort((a, b) => b.val - a.val),
        { chartColors: [C.s2], dataLabelFormatCode: PCT_FMT, valAxisLabelFormatCode: '0"%"' });

    } else if (d.kind === 'calls') {
      const period = periodLabel(d.months);
      const just = d.justTotals['מוצדק'] || 0, unjust = d.justTotals['לא מוצדק'] || 0;
      sectionCover(sec, period, [
        { label: 'סה"כ קריאות', value: fmtInt.format(d.totalCalls), note: fmtInt.format(d.totalLines) + ' שורות פריט' },
        { label: 'קריאות מוצדקות', value: fmtInt.format(just), note: just + unjust ? fmtPct(100 * just / (just + unjust)) + ' מהמסווגות' : '' },
        { label: 'קריאות לא מוצדקות', value: fmtInt.format(unjust) },
        { label: 'קריאות שירות', value: fmtInt.format(d.justTotals['שירות'] || 0), note: 'ללא סיווג הצדקה' },
      ]);

      const groupColors = [C.s1, C.s2, C.s3];
      chartSlide(sec, 'קריאות לפי חודש — מוצדק מול לא מוצדק')
        .addChart(pptx.ChartType.bar,
          d.justKinds.map(k => ({ name: k, labels: d.byMonth.map(r => monthLabel(r.m)), values: d.byMonth.map(r => r[k] || 0) })),
          { ...baseOpts, barDir: 'col', showValue: true, dataLabelFormatCode: INT_FMT,
            chartColors: d.justKinds.map((k, i) => groupColors[i % groupColors.length]),
            showLegend: true, legendPos: 'b', legendFontSize: 12, legendColor: C.ink2, legendFontFace: FONT });

      const pctVals = d.byMonth.map(r => {
        const j = r['מוצדק'] || 0, u = r['לא מוצדק'] || 0;
        return j + u ? Math.round(1000 * j / (j + u)) / 10 : 0;
      });
      lineP(chartSlide(sec, 'אחוז הקריאות המוצדקות לפי חודש'),
        d.byMonth.map(r => monthLabel(r.m)), pctVals,
        { dataLabelFormatCode: PCT_FMT, valAxisMinVal: Math.max(0, Math.floor(Math.min(...pctVals) / 10) * 10 - 10), valAxisMaxVal: Math.min(100, Math.ceil(Math.max(...pctVals) / 10) * 10 + 10) });

      const cReasons = d.byReason.slice(0, 10).map(r => ({ name: r.name, val: r.total }));
      const restC = d.byReason.slice(10);
      if (restC.length) cReasons.push({ name: 'אחר (' + restC.length + ' סיבות)', val: restC.reduce((t, r) => t + r.total, 0) });
      hbar(chartSlide(sec, 'הסיבות המובילות לקריאות שירות'), cReasons, { dataLabelFormatCode: INT_FMT });

      hbar(chartSlide(sec, 'עשרת הלקוחות המובילים בקריאות'),
        d.byCustomer.slice(0, 10).map(r => ({ name: r.name, val: r.total })), { dataLabelFormatCode: INT_FMT });

      hbar(chartSlide(sec, 'קריאות לפי סוג'),
        d.byType.slice(0, 10).map(r => ({ name: r.name, val: r.total })),
        { chartColors: [C.s3], dataLabelFormatCode: INT_FMT });

    } else if (d.agg && d.agg.items.length > 1) {
      hbar(chartSlide(sec, d.agg.value + ' לפי ' + d.agg.label),
        d.agg.items.slice(0, 12).map(r => ({ name: r.name, val: Math.round(r.val) })),
        { dataLabelFormatCode: INT_FMT });
    }
  }

  const today = new Date();
  const fileDate = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  await pptx.writeFile({ fileName: 'Novolog-Data-' + fileDate + '.pptx' });
}

/* ============================================================
   מנהל המצגת
   ============================================================ */
const stage = document.getElementById('stage');
const uploadScreen = document.getElementById('uploadScreen');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const counter = document.getElementById('slideCounter');
const newFilesBtn = document.getElementById('newFilesBtn');
const pptBtn = document.getElementById('pptBtn');

pptBtn.addEventListener('click', async () => {
  pptBtn.disabled = true;
  const label = pptBtn.querySelector('span');
  const orig = label.textContent;
  label.textContent = 'מייצר קובץ...';
  try {
    await exportToPptx();
  } catch (err) {
    console.error(err);
    alert('שגיאה ביצירת קובץ ה-PowerPoint');
  }
  label.textContent = orig;
  pptBtn.disabled = false;
});

let slides = [];
let current = 0;

function fitSlides() {
  const narrow = window.innerWidth <= 700;
  const portrait = window.innerHeight > window.innerWidth;
  const rotated = narrow && portrait; // טלפון אנכי: מסובבים את השקף כדי שימלא את המסך
  stage.classList.toggle('rotated', rotated);
  if (rotated) {
    const availW = stage.clientHeight - 100; // הופך לרוחב השקף אחרי הסיבוב
    const availH = stage.clientWidth - 14;
    const scale = Math.min(availW / 1280, availH / 720);
    slides.forEach(sh => { sh.s.style.transform = `rotate(90deg) scale(${scale})`; });
    return;
  }
  // בטלפון כפתורי הניווט יושבים למטה, אז השקף מקבל כמעט את כל הרוחב
  const shortScreen = window.innerHeight <= 520; // טלפון לרוחב — הגובה הוא המשאב היקר
  const availW = stage.clientWidth - (narrow ? 12 : (shortScreen ? 96 : 140));
  const availH = stage.clientHeight - (narrow ? 64 : (shortScreen ? 14 : 50));
  const scale = Math.min(availW / 1280, availH / 720, 1.15);
  slides.forEach(sh => { sh.s.style.transform = `scale(${scale})`; });
}
window.addEventListener('resize', fitSlides);
window.addEventListener('orientationchange', () => setTimeout(fitSlides, 250));

/* מסך מלא — מפנה גם את שורת הכתובת של הדפדפן בטלפון */
const fsBtn = document.getElementById('fsBtn');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(() => {});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => setTimeout(fitSlides, 150));

/* החלקת אצבע בין שקפים — כיוון RTL: החלקה ימינה = השקף הבא */
let touchX = null, touchY = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { touchX = null; return; }
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });
stage.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (stage.classList.contains('rotated')) {
    // שקף מסובב: החלקה למטה = הבא, למעלה = הקודם (וגם אופקית עדיין עובדת)
    if (Math.abs(dy) >= 50 && Math.abs(dy) > Math.abs(dx) * 1.5) {
      if (dy > 0) goTo(current + 1); else goTo(current - 1);
      return;
    }
  }
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // לא החלקה אופקית
  if (dx > 0) goTo(current + 1); else goTo(current - 1);
}, { passive: true });

function goTo(i) {
  if (!slides.length) return;
  current = Math.max(0, Math.min(i, slides.length - 1));
  slides.forEach((sh, k) => sh.s.classList.toggle('current', k === current));
  counter.textContent = (current + 1) + ' / ' + slides.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

function buildDeck(datasets) {
  currentDatasets = datasets;
  stage.textContent = '';
  slides = [];
  slides.push(buildBrandCoverSlide(datasets));
  // כשנטענים כמה דוחות מאותו סוג — כל אחד מקבל כותרת מובחנת לפי שם הקובץ
  const kindCounts = {};
  datasets.forEach(d => { kindCounts[d.kind] = (kindCounts[d.kind] || 0) + 1; });
  const baseTitles = { damaged: 'העברות למחסן פגומים', inventory: 'ספירות מלאי', calls: 'קריאות שירות' };
  const shortName = (fn, base) => {
    let s = fn.replace(/\.(xlsx|xls|xlsm|csv)$/i, '').trim();
    if (base && s.startsWith(base)) s = s.slice(base.length).trim(); // בלי לחזור על שם הדוח
    if (s.length > 32) {
      s = s.slice(0, 32);
      const sp = s.lastIndexOf(' '); // חיתוך בגבול מילה שלמה
      if (sp > 12) s = s.slice(0, sp);
      s = s.trim() + '…';
    }
    return s || fn;
  };
  for (const d of datasets) {
    let t = baseTitles[d.kind];
    if (t && kindCounts[d.kind] > 1) t += ' — ' + shortName(d.fileName, t);
    if (d.kind === 'damaged') slides.push(...buildDamagedSlides(d, t));
    else if (d.kind === 'inventory') slides.push(...buildInventorySlides(d, t));
    else if (d.kind === 'calls') slides.push(...buildServiceCallsSlides(d, t));
    else slides.push(...buildGenericSlides(d));
  }
  slides.forEach((sh, i) => {
    const pn = sh.s.querySelector('.page-num');
    if (pn) pn.textContent = (i + 1) + ' / ' + slides.length;
    stage.appendChild(sh.s);
  });

  uploadScreen.style.display = 'none';
  stage.classList.add('active');
  prevBtn.classList.add('show');
  nextBtn.classList.add('show');
  counter.classList.add('show');
  fsBtn.classList.add('show');
  newFilesBtn.style.display = '';
  pptBtn.style.display = '';
  fitSlides();
  goTo(0);
}

/* ניווט מקלדת — RTL: שמאלה = קדימה */
document.addEventListener('keydown', e => {
  if (!stage.classList.contains('active')) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
  else if (e.key === 'ArrowRight' || e.key === 'PageUp') { e.preventDefault(); goTo(current - 1); }
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(slides.length - 1);
});
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

/* ============================================================
   העלאת קבצים
   ============================================================ */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const buildBtn = document.getElementById('buildBtn');
const loadingMsg = document.getElementById('loadingMsg');

const loaded = [];      // {name, dataset|null, hash, dupOf, error}

// חישוב כפילויות מחדש על כל הרשימה — נדרש גם אחרי מחיקת קובץ
function recomputeDups() {
  const seen = new Map(); // hash תוכן -> שם הקובץ הראשון
  for (const f of loaded) {
    if (!f.dataset) continue;
    if (seen.has(f.hash)) {
      f.dupOf = seen.get(f.hash);
      f.dataset.dupNote = f.dupOf;
    } else {
      seen.set(f.hash, f.name);
      f.dupOf = null;
      delete f.dataset.dupNote;
    }
  }
}

function refreshFileList() {
  fileListEl.textContent = '';
  for (const f of loaded) {
    const row = el('div', 'file-row');
    row.appendChild(el('span', 'fname', f.name));
    let type, cls = '';
    if (f.error) { type = 'שגיאה בקריאה'; cls = 'err'; }
    else if (f.dataset.kind === 'damaged') type = 'העברות פגומים';
    else if (f.dataset.kind === 'inventory') type = 'ספירות מלאי';
    else if (f.dataset.kind === 'calls') type = 'קריאות שירות';
    else type = 'קובץ כללי';
    const tag = el('span', 'ftype' + (cls ? ' ' + cls : ''), type);
    if (f.dupOf) tag.title = 'התוכן זהה לחלוטין ל: ' + f.dupOf + ' — כדאי לבדוק את הייצוא במקור';
    row.appendChild(tag);

    // מחיקת הקובץ מהרשימה — מאפשר להעלות גרסה מעודכנת בלי לרענן את הדף
    const delBtn = el('button', 'del-btn');
    delBtn.title = 'הסר את הקובץ מהרשימה';
    delBtn.setAttribute('aria-label', 'הסר את ' + f.name);
    delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
    const idx = loaded.indexOf(f);
    delBtn.addEventListener('click', () => {
      loaded.splice(idx, 1);
      recomputeDups();
      refreshFileList();
    });
    row.appendChild(delBtn);
    fileListEl.appendChild(row);
  }
  buildBtn.disabled = !loaded.some(f => f.dataset);
}

async function handleFiles(files) {
  if (!files.length) return;
  loadingMsg.classList.add('show');
  await new Promise(r => setTimeout(r, 30)); // לתת למסך הטעינה להצטייר
  for (const file of files) {
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const dataset = detectAndParse(wb, file.name);
      // זיהוי כפילויות לפי התוכן המפוענח — גם קבצים עם שם שונה אך נתונים זהים
      const { fileName, ...content } = dataset;
      const h = hashString(JSON.stringify(content));
      loaded.push({ name: file.name, dataset, hash: h, dupOf: null });
    } catch (err) {
      console.error(err);
      loaded.push({ name: file.name, dataset: null, hash: null, dupOf: null, error: true });
    }
  }
  recomputeDups();
  loadingMsg.classList.remove('show');
  refreshFileList();
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { handleFiles([...fileInput.files]); fileInput.value = ''; });
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles([...e.dataTransfer.files].filter(f => /\.(xlsx|xls|xlsm|csv)$/i.test(f.name)));
});

buildBtn.addEventListener('click', () => {
  const datasets = loaded.filter(f => f.dataset).map(f => f.dataset);
  // סדר קבוע: פגומים, ספירות, כלליים
  const order = { damaged: 0, inventory: 1, calls: 2, generic: 3 };
  datasets.sort((a, b) => order[a.kind] - order[b.kind]);
  buildDeck(datasets);
});

newFilesBtn.addEventListener('click', () => {
  stage.classList.remove('active');
  prevBtn.classList.remove('show');
  nextBtn.classList.remove('show');
  counter.classList.remove('show');
  fsBtn.classList.remove('show');
  newFilesBtn.style.display = 'none';
  pptBtn.style.display = 'none';
  uploadScreen.style.display = '';
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('gs_auth');
  location.href = 'login.html';
});
</script>
