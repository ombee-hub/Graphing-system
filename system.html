<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת גרפים</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffca0f'/%3E%3Cg stroke='%233c4d5c' stroke-width='6' stroke-linecap='round'%3E%3Cline x1='16' y1='48' x2='16' y2='32'/%3E%3Cline x1='28' y1='48' x2='28' y2='18'/%3E%3Cline x1='40' y1='48' x2='40' y2='28'/%3E%3Cline x1='52' y1='48' x2='52' y2='14'/%3E%3C/g%3E%3C/svg%3E">
<script>

  (function () {

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/pptxgen.bundle.js"></script>
<style>
  /* פונט Assistant — מקומי, עובד גם בלי אינטרנט (פונט משתנה, כל המשקלים) */
  @font-face {
    font-family: 'Assistant';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('lib/fonts/assistant-hebrew.woff2') format('woff2');
    unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
  }
  @font-face {
    font-family: 'Assistant';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('lib/fonts/assistant-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Assistant';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('lib/fonts/assistant-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    /* מותג Novolog */
    --brand: #3c4d5c;
    --brand-dark: #2b3844;
    --bg-deep: #232e38;
    --accent: #ffca0f;
    --accent-dark: #e6b400;

    /* פלטת גרפים — אומתה לבטיחות עיוורון צבעים וניגודיות על שקף לבן */
    --series-1: #2f66a5;   /* כחול פלדה — סדרה ראשית */
    --series-2: #b8860b;   /* ענבר — סדרה שנייה */
    --series-3: #159d7f;   /* טורקיז — סדרה שלישית */
    --critical: #d03b3b;   /* סטטוס שלילי */

    /* דיו וכרום על שקף לבן */
    --slide-surface: #ffffff;
    --ink: #24303a;
    --ink-2: #52616e;
    --muted: #8794a0;
    --grid: #e7eaee;
    --baseline: #c5ccd3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Assistant', 'Segoe UI', Arial, sans-serif;
    background: var(--bg-deep);
    color: #fff;
    overflow: hidden;
  }

  /* ===================== סרגל עליון ===================== */
  header.topbar {
    position: fixed;
    top: 0; right: 0; left: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: rgba(35,46,56,.92);
    border-bottom: 1px solid rgba(255,255,255,.08);
    z-index: 50;
  }
  .topbar .mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .topbar .mark svg { width: 19px; height: 19px; }
  .topbar h1 { font-size: 17px; font-weight: 800; }
  .topbar .spacer { flex: 1; }
  .topbar button {
    font: inherit; font-size: 14px; font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background .12s;
  }
  .topbar button:hover { background: rgba(255,255,255,.16); }
  .topbar button.primary {
    color: var(--brand-dark);
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    font-weight: 800;
  }
  /* כפתורים אדומים — התנתקות ו-PowerPoint, מובחנים משאר הכפתורים */
  .topbar button.danger {
    background: #d03b3b;
    border-color: #d03b3b;
  }
  .topbar button.danger:hover { background: #b73030; }

  .topbar button.ppt-btn {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar button.ppt-btn svg { width: 17px; height: 17px; flex: none; }
  .topbar button.ppt-btn:disabled { opacity: .55; cursor: wait; }

  /* ===================== מסך העלאת קבצים ===================== */
  #uploadScreen {
    position: fixed; inset: 56px 0 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 30px;
  }

  .upload-logo {
    height: 74px;
    margin-bottom: 8px;
  }

  .upload-copyright {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: rgba(255,255,255,.5);
  }
  .upload-copyright a { display: flex; opacity: .75; transition: opacity .12s; }
  .upload-copyright a:hover { opacity: 1; }
  .upload-copyright img { height: 22px; display: block; }

  /* ===================== שקף פתיחה ממותג ===================== */
  .slide.brand-cover {
    background: #37485a;
    color: #fff;
    padding: 0;
  }
  .slide.brand-cover::before { display: none; } /* בלי פס המותג הרגיל — יש עיצוב מלא */

  .brand-cover .bc-hero {
    position: absolute;
    top: 52px; left: 60px;
  }
  .brand-cover .bc-hero img { display: block; height: 100px; }

  .brand-cover .bc-title {
    position: absolute;
    top: 50%; right: 90px;
    transform: translateY(-72%);
    text-align: right;
  }
  .brand-cover .bc-title h2 {
    font-size: 58px;
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
  }
  .brand-cover .bc-title .bc-sub {
    font-size: 22px;
    color: rgba(255,255,255,.75);
    margin-top: 14px;
  }

  /* פס הבלוקים הצבעוניים בתחתית השקף — צהוב · ירוק · תכלת */
  .brand-cover .bc-band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 150px;
    background: #fff;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    padding-top: 22px;
    overflow: hidden;
  }
  .brand-cover .bc-band > div { height: calc(100% - 22px); }
  .brand-cover .bc-band .bb-yellow { width: 76px; margin-left: -20px; background: var(--accent); }
  .brand-cover .bc-band .bb-green  { width: 200px; background: #3aab4f; }
  .brand-cover .bc-band .bb-blue   { flex: 1; margin-right: 14px; background: #4bb8e8; }
  .dropzone {
    width: min(680px, 92vw);
    border: 2px dashed rgba(255,255,255,.3);
    border-radius: 18px;
    background: rgba(255,255,255,.04);
    padding: 54px 30px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.dragover { border-color: var(--accent); background: rgba(255,202,15,.08); }
  .dropzone .dz-icon {
    width: 64px; height: 64px; margin: 0 auto 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
  }
  .dropzone .dz-icon svg { width: 32px; height: 32px; }
  .dropzone h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .dropzone p { font-size: 15px; color: rgba(255,255,255,.65); }
  .dropzone p b { color: var(--accent); }

  #fileList {
    width: min(680px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14.5px;
  }
  .file-row .fname { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .ftype {
    font-size: 12.5px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(255,202,15,.16);
    border: 1px solid rgba(255,202,15,.4);
    color: var(--accent);
    flex: none;
  }
  .file-row .ftype.err { background: rgba(208,59,59,.15); border-color: rgba(208,59,59,.5); color: #ff9a9a; }
  .file-row .del-btn {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: rgba(255,255,255,.45);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .file-row .del-btn:hover { background: rgba(208,59,59,.18); color: #ff8383; }
  .file-row .del-btn svg { width: 17px; height: 17px; }

  #buildBtn {
    font: inherit; font-size: 17px; font-weight: 800;
    color: var(--brand-dark);
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none; border-radius: 12px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,202,15,.3);
    transition: transform .12s, box-shadow .12s;
  }
  #buildBtn:hover { transform: translateY(-1px); box-shadow: 0 11px 26px rgba(255,202,15,.4); }
  #buildBtn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ===================== במת המצגת ===================== */
  #stage {
    position: fixed; inset: 56px 0 0 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #stage.active { display: flex; }

  .slide {
    width: 1280px;
    height: 720px;
    background: var(--slide-surface);
    color: var(--ink);
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    position: absolute;
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    padding: 54px 70px 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    overflow: hidden;
  }
  .slide.current { opacity: 1; pointer-events: auto; }

  /* פס מותג בראש כל שקף */
  .slide::before {
    content: '';
    position: absolute;
    top: 0; right: 0; left: 0;
    height: 8px;
    background: linear-gradient(-90deg, var(--brand) 0 72%, var(--accent) 72% 100%);
  }

  .slide .s-head { margin-bottom: 18px; flex: none; }
  .slide .s-kicker {
    font-size: 15px; font-weight: 700;
    color: var(--ink-2);
    letter-spacing: .02em;
    margin-bottom: 2px;
  }
  .slide h2 {
    font-size: 34px;
    font-weight: 800;
    color: var(--brand-dark);
    line-height: 1.15;
  }
  .slide .s-sub { font-size: 16.5px; color: var(--ink-2); margin-top: 4px; }
  .slide .s-body { flex: 1; min-height: 0; position: relative; }

  .slide .s-foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    padding-top: 12px;
  }
  .slide .s-foot .foot-brand { display: flex; align-items: center; gap: 10px; }
  .slide .s-foot img { height: 20px; display: block; }

  /* שקף שער */
  .slide.cover { justify-content: center; padding: 70px 90px; }
  .slide.cover .cover-kicker {
    display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .slide.cover .cover-kicker img { height: 38px; display: block; }
  .slide.cover .cover-kicker::before {
    content: ''; width: 34px; height: 6px; border-radius: 3px;
    background: var(--accent);
  }
  .slide.cover h2 { font-size: 54px; margin-bottom: 8px; }
  .slide.cover .s-sub { font-size: 21px; margin-bottom: 44px; }

  /* אריחי נתונים */
  .kpi-row { display: flex; gap: 20px; }
  .kpi {
    flex: 1;
    background: #f6f8fa;
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 20px 22px;
  }
  .kpi .k-label { font-size: 14.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
  .kpi .k-value { font-size: 36px; font-weight: 800; color: var(--brand-dark); line-height: 1.1; }
  .kpi .k-note { font-size: 13px; color: var(--muted); margin-top: 5px; }

  /* גרפים */
  .chart-wrap { position: absolute; inset: 0; }
  .chart-wrap svg { display: block; width: 100%; height: 100%; }
  svg text { font-family: 'Assistant', 'Segoe UI', Arial, sans-serif; }

  .viz-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--brand-dark);
    color: #fff;
    border-radius: 9px;
    padding: 9px 13px;
    font-size: 13.5px;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    opacity: 0;
    transition: opacity .1s;
    z-index: 10;
    max-width: 300px;
  }
  .viz-tooltip .tt-title { font-weight: 700; margin-bottom: 3px; }
  .viz-tooltip .tt-row { display: flex; align-items: baseline; gap: 8px; }
  .viz-tooltip .tt-row .tt-key {
    display: inline-block; width: 14px; height: 3px; border-radius: 2px;
    flex: none; align-self: center;
  }
  .viz-tooltip .tt-row b { font-size: 15px; }
  .viz-tooltip .tt-row span { color: rgba(255,255,255,.75); }

  /* מקרא */
  .legend {
    position: absolute;
    top: -4px; left: 0;
    display: flex; gap: 18px;
    font-size: 13.5px; font-weight: 600; color: var(--ink-2);
    z-index: 5;
  }
  .legend .lg-item { display: flex; align-items: center; gap: 7px; }
  .legend .lg-swatch { width: 13px; height: 13px; border-radius: 4px; }

  /* תצוגת טבלה */
  .table-overlay {
    position: absolute; inset: 0;
    background: var(--slide-surface);
    display: none;
    overflow: auto;
    z-index: 8;
  }
  .table-overlay.show { display: block; }
  .table-overlay table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .table-overlay th {
    text-align: right; font-weight: 700; color: var(--brand-dark);
    border-bottom: 2px solid var(--brand);
    padding: 8px 12px;
    position: sticky; top: 0; background: var(--slide-surface);
  }
  .table-overlay td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--grid);
    color: var(--ink);
  }
  .table-overlay td.num { font-variant-numeric: tabular-nums; }

  .tbl-btn {
    position: absolute;
    top: -38px; left: 0;
    font: inherit; font-size: 13px; font-weight: 700;
    color: var(--ink-2);
    background: #f1f4f7;
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 5px 13px;
    cursor: pointer;
    z-index: 9;
  }
  .tbl-btn:hover { background: #e8edf2; }

  /* ===================== ניווט ===================== */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08);
    color: #fff;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    transition: background .12s;
  }
  .nav-btn:hover { background: rgba(255,202,15,.85); color: var(--brand-dark); }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.show { display: flex; }
  #prevBtn { right: 18px; }
  #nextBtn { left: 18px; }
  .nav-btn:disabled { opacity: .25; cursor: default; }
  .nav-btn:disabled:hover { background: rgba(255,255,255,.08); color: #fff; }

  #slideCounter {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 13.5px; font-weight: 600;
    color: rgba(255,255,255,.75);
    background: rgba(0,0,0,.3);
    border-radius: 999px;
    padding: 5px 16px;
    z-index: 60;
    display: none;
  }
  #slideCounter.show { display: block; }

  #loadingMsg {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
    background: rgba(35,46,56,.85);
    z-index: 100;
    font-size: 19px; font-weight: 700;
  }
  #loadingMsg.show { display: flex; }
  #loadingMsg img {
    width: 72px;
    animation: nv-spin 1.4s linear infinite;
  }
  @keyframes nv-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===================== התאמה לטלפון ===================== */
  @media (max-width: 700px) {
    header.topbar { height: 48px; gap: 7px; padding: 0 10px; }
    .topbar h1 { font-size: 14px; }
    .topbar .mark { width: 28px; height: 28px; border-radius: 7px; }
    .topbar .mark svg { width: 15px; height: 15px; }
    .topbar button { font-size: 12px; padding: 6px 9px; border-radius: 7px; }

    #uploadScreen { inset: 48px 0 0 0; padding: 14px; gap: 14px; }
    .dropzone { padding: 30px 16px; }
    .dropzone h2 { font-size: 18px; }
    .dropzone p { font-size: 13.5px; }
    .file-row { font-size: 13px; padding: 8px 10px; gap: 8px; }
    .file-row .ftype { font-size: 11px; padding: 2px 8px; }
    #buildBtn { font-size: 15px; padding: 12px 34px; }

    #stage { inset: 48px 0 0 0; }
    .nav-btn { width: 40px; height: 40px; top: auto; bottom: 12px; }
    #prevBtn { right: 12px; }
    #nextBtn { left: 12px; }
    .nav-btn svg { width: 18px; height: 18px; }
    #slideCounter { bottom: 22px; font-size: 12px; padding: 4px 12px; }
  }

  /* טלפון לרוחב — מסך נמוך: מכווצים את הכרום כדי לפנות גובה לשקף */
  @media (max-height: 520px) {
    header.topbar { height: 40px; gap: 7px; padding: 0 10px; }
    .topbar h1 { font-size: 13px; }
    .topbar .mark { width: 26px; height: 26px; border-radius: 6px; }
    .topbar .mark svg { width: 14px; height: 14px; }
    .topbar button { font-size: 11.5px; padding: 4px 9px; border-radius: 7px; }
    #stage { inset: 40px 0 0 0; }
    /* מסך ההעלאה גולש במסך נמוך — מאפשרים גלילה */
    #uploadScreen {
      inset: 40px 0 0 0;
      justify-content: flex-start;
      overflow-y: auto;
      padding: 16px;
      gap: 12px;
    }
    #uploadScreen .upload-logo { height: 48px; flex: none; }
    #uploadScreen .dropzone { padding: 20px 16px; flex: none; }
    #uploadScreen .upload-copyright { position: static; margin-top: 6px; flex: none; }
    .nav-btn { width: 38px; height: 38px; top: 50%; bottom: auto; }
    #prevBtn { right: 8px; }
    #nextBtn { left: 8px; }
    .nav-btn svg { width: 17px; height: 17px; }
    #slideCounter { bottom: 6px; font-size: 11px; padding: 3px 10px; }
  }

  /* כפתור מסך מלא — מוצג בטלפונים לצד מונה השקפים */
  #fsBtn {
    position: fixed;
    bottom: 10px;
    left: calc(50% + 62px);
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08);
    color: #fff;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
  }
  #fsBtn:hover { background: rgba(255,202,15,.85); color: var(--brand-dark); }
  #fsBtn svg { width: 17px; height: 17px; }
  @media (max-width: 700px), (max-height: 520px) {
    #fsBtn.show { display: flex; }
  }
</style>
</head>
<body>

<header class="topbar">

</button>

  <img src="icon-novolog-logo.png" alt="">
  <span>מעלה קבצים...</span>
