<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת גרפים - התחברות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffca0f'/%3E%3Cg stroke='%233c4d5c' stroke-width='6' stroke-linecap='round'%3E%3Cline x1='16' y1='48' x2='16' y2='32'/%3E%3Cline x1='28' y1='48' x2='28' y2='18'/%3E%3Cline x1='40' y1='48' x2='40' y2='28'/%3E%3Cline x1='52' y1='48' x2='52' y2='14'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* פונט Assistant — מקומי, עובד גם בלי אינטרנט (פונט משתנה, כל המשקלים) */
  @font-face {
    font-family: 'Assistant';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('lib/fonts/assistant-hebrew.woff2') format('woff2');
    unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
  }
  @font-face {
    font-family: 'Assistant';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('lib/fonts/assistant-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Assistant';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('lib/fonts/assistant-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    /* צבעי המותג של Novolog */
    --brand: #3c4d5c;        /* כחול-אפור כהה */
    --brand-dark: #2b3844;   /* גוון כהה יותר של צבע המותג */
    --accent: #ffca0f;       /* צהוב Novolog */
    --accent-dark: #e6b400;
    --bg-1: #232e38;
    --bg-2: #3c4d5c;
    --card: #ffffff;
    --text: #3c4d5c;
    --muted: #64748b;
    --border: #e2e8f0;
    --error: #dc2626;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Assistant', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 60%, #4d6273 100%);
    color: var(--text);
    padding: 24px;
  }

  /* עיגולים דקורטיביים ברקע */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
  }
  body::before {
    width: 480px; height: 480px;
    top: -160px; left: -160px;
    background: radial-gradient(circle, rgba(255,202,15,.14), transparent 70%);
  }
  body::after {
    width: 600px; height: 600px;
    bottom: -220px; right: -180px;
    background: radial-gradient(circle, rgba(255,202,15,.08), transparent 70%);
  }

  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,.35);
    padding: 44px 40px 36px;
    animation: rise .5s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }

  .logo-mark {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(255,202,15,.35);
  }

  .logo-mark svg { width: 34px; height: 34px; }

  .logo h1 { font-size: 22px; font-weight: 800; color: var(--brand); }
  .logo p  { font-size: 14px; color: var(--muted); }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }

  .input-wrap { position: relative; }

  .input-wrap input {
    width: 100%;
    padding: 12px 14px;
    padding-left: 44px;
    font: inherit;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #f8fafc;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }

  .input-wrap input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255,202,15,.25);
  }

  .toggle-pass {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    padding: 6px;
    color: var(--muted);
    display: flex;
  }
  .toggle-pass:hover { color: var(--brand); }
  .toggle-pass svg { width: 20px; height: 20px; }
  .toggle-pass.active { color: var(--accent-dark); }

  .show-pass-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .show-pass-row input {
    width: 16px; height: 16px;
    accent-color: var(--accent-dark);
    cursor: pointer;
  }
  .show-pass-row:hover span { color: var(--brand); }

  .capslock-warn {
    display: none;
    margin-top: 8px;
    font-size: 13.5px;
    font-weight: 700;
    color: #92700a;
    background: #fff8dd;
    border: 1px solid #f5d874;
    border-radius: 8px;
    padding: 7px 12px;
  }
  .capslock-warn.show { display: block; }

  .error-msg {
    display: none;
    align-items: center;
    gap: 8px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--error);
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
  }
  .error-msg.show { display: flex; animation: shake .35s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .btn-login {
    width: 100%;
    padding: 13px;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    color: var(--brand-dark);
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, opacity .12s;
    box-shadow: 0 6px 16px rgba(255,202,15,.35);
  }
  .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(255,202,15,.45); }
  .btn-login:active:not(:disabled) { transform: translateY(0); }
  .btn-login:disabled { opacity: .65; cursor: wait; }

  .footer-note {
    margin-top: 26px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  /* ===================== התאמה לטלפון ===================== */
  @media (max-width: 480px) {
    body { padding: 14px; }
    .login-card { padding: 30px 22px 26px; border-radius: 16px; }
    .logo h1 { font-size: 20px; }
    /* גופן 16px בשדות מונע זום אוטומטי ב-iPhone */
    .input-wrap input { font-size: 16px; }
  }
</style>
</head>
<body>

<main class="login-card">
  <div class="logo">
    <div class="logo-mark" aria-hidden="true">
      <!-- אייקון גרף עמודות -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#3c4d5c" stroke-width="2.4" stroke-linecap="round">
        <line x1="5"  y1="20" x2="5"  y2="12"/>
        <line x1="10" y1="20" x2="10" y2="6"/>
        <line x1="15" y1="20" x2="15" y2="10"/>
        <line x1="20" y1="20" x2="20" y2="4"/>
      </svg>
    </div>
    <h1>מערכת הגרפים</h1>
  </div>

  <div class="error-msg" id="errorMsg" role="alert">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>שם משתמש או סיסמה שגויים</span>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">שם משתמש</label>
      <div class="input-wrap">
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
    </div>

    <div class="field">
      <label for="password">סיסמה</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="הצג / הסתר סיסמה" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label class="show-pass-row">
        <input type="checkbox" id="showPassCheck">
        <span>הצג סיסמה</span>
      </label>
      <div class="capslock-warn" id="capsWarn">⚠ שים לב: Caps Lock דלוק</div>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">התחברות למערכת</button>
  </form>

  <p class="footer-note">© 2026 כל הזכויות שמורות ל־Novolog Ltd</p>
</main>

<script>
/* ============================================================
   ניהול משתמשים
   ------------------------------------------------------------
   הסיסמאות שמורות כגיבוב SHA-256 בלבד (לא גלויות בקוד).

   כדי להוסיף משתמש או להחליף סיסמה: פתחו את ה-Console בדפדפן (F12)
   והריצו:  await hashPassword('הסיסמה החדשה')
   ואת התוצאה מדביקים כאן ליד שם המשתמש.
   ============================================================ */
const USERS = {
  'admin':   'bc7e1b3658e1ddbd677974ee88abc86527245923bfa15c78de4717d32ec50f98',
  'novolog': '605cb6d9c98f75c56af057501ec2ef2c8d4fff8c915112a466d26a72bb36453f'
};

// הדף שאליו עוברים אחרי התחברות מוצלחת (המערכת עצמה)
const TARGET_PAGE = 'system.html';

async function hashPassword(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}
window.hashPassword = hashPassword;

const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.remove('show');
  loginBtn.disabled = true;
  loginBtn.textContent = 'בודק...';

  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  const expected = USERS[username];
  const actual = await hashPassword(password);

  if (expected && expected === actual) {
    sessionStorage.setItem('gs_auth', JSON.stringify({ user: username, at: Date.now() }));
    loginBtn.textContent = 'מתחבר...';
    location.href = TARGET_PAGE;
  } else {
    loginBtn.disabled = false;
    loginBtn.textContent = 'התחברות למערכת';
    errorMsg.classList.add('show');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});

// הצגה/הסתרה של הסיסמה — האייקון והתיבה מסונכרנים
const passInput = document.getElementById('password');
const toggleBtn = document.getElementById('togglePass');
const showCheck = document.getElementById('showPassCheck');

function setPassVisible(visible) {
  passInput.type = visible ? 'text' : 'password';
  showCheck.checked = visible;
  toggleBtn.classList.toggle('active', visible);
}
toggleBtn.addEventListener('click', () => setPassVisible(passInput.type === 'password'));
showCheck.addEventListener('change', () => setPassVisible(showCheck.checked));

// התראה כש-Caps Lock דלוק
const capsWarn = document.getElementById('capsWarn');
function checkCaps(e) {
  if (typeof e.getModifierState === 'function') {
    capsWarn.classList.toggle('show', e.getModifierState('CapsLock'));
  }
}
passInput.addEventListener('keydown', checkCaps);
passInput.addEventListener('keyup', checkCaps);
passInput.addEventListener('blur', () => capsWarn.classList.remove('show'));

// אם כבר מחוברים — לדלג ישר למערכת
if (sessionStorage.getItem('gs_auth')) {
  location.replace(TARGET_PAGE);
}
</script>

</body>
</html>
